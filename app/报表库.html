<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手机端 · 报表库（v2.0）</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
        font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
        background: #f4f5f7; color: #1a1a1a; min-height: 100vh; display: flex; align-items: stretch;
    }
    .phone { flex: 1 1 auto; min-width: 0; min-height: 100vh; background: #f4f5f7; display: flex; flex-direction: column; }

    /* ================= 顶部导航（三页统一：返回 + 页面标题＝当前 tab；三个 tab 可相互点击切换） ================= */
    .topbar {
        height: 52px; background: #fff; border-bottom: 1px solid #e8e8e8; flex-shrink: 0;
        display: flex; align-items: center; padding: 0 12px;
    }
    .topbar-back {
        width: 30px; height: 30px; flex-shrink: 0; border: none; background: transparent;
        border-radius: 50%; color: #1a1a1a; font-size: 22px; line-height: 1; font-family: inherit;
        display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .topbar-back:hover { background: #f2f3f5; }
    /* 多语言下 Tab 文案会变长：Tab 条自己横向滚动、Tab 不被压缩，返回键与右侧入口固定不被挤走 */
    .top-tabs {
        flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 20px; margin-left: 6px;
        overflow-x: auto; scrollbar-width: none;
        -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain;
    }
    .top-tabs::-webkit-scrollbar { display: none; }
    .top-tab {
        position: relative; flex-shrink: 0; border: none; background: transparent; font-family: inherit; cursor: pointer;
        height: 52px; padding: 0; font-size: 15px; color: #8b90a0; white-space: nowrap;
    }
    .top-tab:hover:not(.active) { color: #E60012; }
    .top-tab.active { font-size: 17px; font-weight: 600; color: #161a2e; letter-spacing: .2px; cursor: default; }
    .top-tab.active::after {
        content: ''; position: absolute; left: 50%; transform: translateX(-50%); bottom: 8px;
        width: 20px; height: 2px; border-radius: 2px; background: #E60012;
    }
    /* 页面表头：返回与标题统一在 .topbar，这里只放本页的搜索与申请入口 */
    .app-header { background: #fff; padding: 12px 14px; flex-shrink: 0; border-bottom: 1px solid #eef0f3; }
    /* 顶部右上角：报表需求征集快速入口（多语言文案过长时省略号截断，不挤压 Tab） */
    .quick-more {
        margin-left: auto; flex-shrink: 0; font-family: inherit; white-space: nowrap;
        max-width: 42%; overflow: hidden; text-overflow: ellipsis;
        background: #fdecee; color: #E60012; border: 1px solid #f8d5d9; border-radius: 14px;
        font-size: 12px; font-weight: 600; padding: 4px 10px; cursor: pointer;
        transition: background .16s, border-color .16s, transform .1s;
    }
    .quick-more:hover { background: #fbdde1; border-color: #f2bcc2; }
    .quick-more:active { transform: scale(.97); }
    .search-wrap { position: relative; }
    .search-input {
        width: 100%; height: 36px; border: none; border-radius: 18px; background: #f4f5f7;
        padding: 0 14px 0 34px; font-size: 13px; font-family: inherit; color: #1a1a1a; outline: none;
    }
    .search-input::placeholder { color: #b0b4bd; }
    .search-icon {
        position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
        color: #b0b4bd; display: flex; pointer-events: none;
    }
    /* 引导文案（可点，与机群数据页一致）：没找到合适的报表时怎么申请，居中显示 */
    .view-hint {
        flex-shrink: 0; background: #fffaf0; color: #ad6800; font-size: 12px; line-height: 1.6;
        padding: 9px 24px; border-bottom: 1px solid #f5ecd8;
        text-align: center; cursor: pointer;
    }
    .view-hint:hover { background: #fff5e0; }
    .view-hint b { color: #E60012; font-weight: 600; }

    /* ================= 内容区 ================= */
    .screen { flex: 1; overflow-y: auto; padding: 2px 14px 28px; }
    .group-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 2px 9px; }
    .group-name { font-size: 14px; font-weight: 700; color: #161a2e; display: flex; align-items: center; gap: 7px; }
    .group-name::before { content: ''; width: 3px; height: 13px; border-radius: 2px; background: #E60012; }
    .group-count { font-size: 11px; color: #a0a4ad; }

    .card {
        background: #fff; border-radius: 16px; padding: 14px 15px; margin-bottom: 10px;
        box-shadow: 0 1px 3px rgba(22,26,46,.05);
    }
    .report-card.is-disabled { background: #fafbfc; box-shadow: none; }
    .rc-top { display: flex; gap: 11px; }
    .rc-icon {
        width: 36px; height: 36px; border-radius: 11px; flex-shrink: 0;
        background: #f0f1f4; color: #8b90a0; display: flex; align-items: center; justify-content: center;
    }
    .report-card.is-disabled .rc-icon { background: #f0f1f4; color: #c3c7cf; }
    .rc-info { flex: 1; min-width: 0; }
    .rc-name { font-size: 15px; font-weight: 600; color: #161a2e; line-height: 1.4; }
    .report-card.is-disabled .rc-name { color: #9aa0ad; }
    .rc-tag { display: inline-block; margin-left: 6px; font-size: 10px; font-weight: 400; border-radius: 999px; padding: 2px 8px; vertical-align: middle; }
    .rc-tag.live { color: #E60012; background: #fdecee; }
    .rc-tag.planned { color: #1890ff; background: #e6f4ff; }
    .rc-desc { font-size: 12px; color: #8b90a0; line-height: 1.6; margin-top: 5px; }
    .rc-na {
        display: inline-block; margin-top: 10px; font-size: 11px; color: #a8adb8;
        background: #f2f3f5; border-radius: 999px; padding: 3px 10px;
    }
    .rc-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 13px; }
    .btn-line {
        border: 1px solid #e3e5ea; background: #fff; color: #666; font-size: 12px; font-family: inherit;
        padding: 7px 16px; border-radius: 18px; cursor: pointer;
    }
    .btn-line:hover { border-color: #E60012; color: #E60012; }
    .btn-solid {
        border: none; background: #E60012; color: #fff; font-size: 12px; font-family: inherit;
        padding: 8px 18px; border-radius: 18px; cursor: pointer; box-shadow: 0 2px 8px rgba(230,0,18,.2);
    }
    .btn-solid:hover { background: #c40011; }
    .empty-wrap { padding: 80px 24px; text-align: center; font-size: 13px; color: #b0b4bd; }

    /* ================= 预览面板（底部弹出） ================= */
    .sheet-mask {
        position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 60;
        display: none; align-items: flex-end; justify-content: center;
    }
    .sheet-mask.active { display: flex; }
    .sheet {
        width: 100%; max-width: 520px; max-height: 84vh; background: #fff;
        border-radius: 18px 18px 0 0; display: flex; flex-direction: column; overflow: hidden;
    }
    .sheet-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px 14px; border-bottom: 1px solid #f2f3f6; }
    .sheet-title { flex: 1; min-width: 0; font-size: 16px; font-weight: 700; color: #161a2e; }
    .sheet-close { font-size: 16px; color: #b0b4bd; cursor: pointer; line-height: 1; }
    .sheet-body { padding: 14px 18px; overflow-y: auto; }
    .sheet-foot { padding: 12px 18px 18px; }
    .sheet-foot button {
        width: 100%; border: none; background: #E60012; color: #fff; font-size: 14px; font-family: inherit;
        padding: 12px 0; border-radius: 22px; cursor: pointer;
    }
    .sheet-foot button:hover { background: #c40011; }

    .preview-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .sample-note { font-size: 11px; color: #bbb; margin-left: auto; text-align: right; }

    .kv { border-top: 1px solid #f4f5f7; }
    .kv-row { display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; border-bottom: 1px solid #f6f6f6; font-size: 12px; }
    .kv-row:last-child { border-bottom: none; }
    .kv-k { width: 92px; flex-shrink: 0; color: #8b90a0; line-height: 1.5; }
    .kv-v { flex: 1; min-width: 0; color: #333; line-height: 1.5; word-break: break-all; }
    .dev-block { border: 1px solid #f0f1f4; border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
    .dev-block:last-child { margin-bottom: 0; }
    .dev-title { font-size: 12px; font-weight: 600; color: #161a2e; padding-bottom: 6px; }
    .na-box { border: 1px dashed #e0e0e0; border-radius: 10px; padding: 30px 16px; text-align: center; font-size: 12px; color: #bbb; }
</style>
</head>

</div>

<!-- ==================== 预览面板 ==================== -->
<div class="sheet-mask" id="previewSheet" onclick="closePreview()">

        </div>
        <div class="sheet-body" id="previewBody"></div>
        <div class="sheet-foot" id="previewFoot"></div>
    </div>
</div>

/* ==================== 示例数据（按报表口径取：单机 = 单台，机群 / 项目 = 多台） ==================== */
const PERIOD = '2026-09-01 ~ 2026-09-30';
const FLEET_DEVICES = ['F3S01395', 'F3S01402', 'F3S01418'];
const FLEET_FACTORS = [1, 0.88, 0.71];
const NATURE_ORDER = ['设备概览', '能耗与成本', '作业与效率', '安全与事件', '位置与维保', '发电机', '项目维度'];

const searchInput = document.getElementById('searchInput');
const screenEl = document.getElementById('screen');
let previewState = { key: reports[0].key };   // 口径由报表决定，不再切换

function cellText(rep, ci, v, factor) {
    if (typeof v !== 'number') return v;
    const x = v * factor;
    return (rep.intCols || []).indexOf(ci) >= 0 ? String(Math.round(x)) : x.toFixed(1);
}

/* 每台设备一套「字段 → 值」 */
function deviceRows(rep, factor) {
    return rep.metrics.map(function (m, i) {
        return { k: m, v: cellText(rep, i, rep.vals[i], factor) };
    });
}

function rep2match(r, kw) {
    return r.metrics.some(function (m) { return m.toLowerCase().indexOf(kw) >= 0; });
}

/* 口径徽标（单机 / 机群 / 项目）：口径由报表本身决定，App 端不再提供切换 */
function scopeTag(rep) {
    const st = {
        '单机': 'background:#f1f3f6;color:#5a6472;',
        '机群': 'background:#fdecee;color:#E60012;',
        '项目': 'background:#f3ecff;color:#7C3AED;'
    }[rep.scope] || 'background:#f2f3f5;color:#8b90a0;';
    return '<span class="rc-tag" style="' + st + '">' + (rep.scope || '') + '</span>';
}


/* ==================== 渲染：报表清单（按报表性质分组） ==================== */
function renderCard(rep) {
    const usable = rep.metrics.length > 0;
    return `
        <div class="card report-card${usable ? '' : ' is-disabled'}">
            <div class="rc-top">
                <div class="rc-icon">${ICONS[rep.icon] || ICONS.summary}</div>
                <div class="rc-info">
                    <div class="rc-name">${rep.name}${scopeTag(rep)}</div>
                    <div class="rc-desc">${rep.group} · ${rep.desc}</div>
                </div>
            </div>
            ${usable ? '' : '<div class="rc-na">数据源未接入 · 本期不实现</div>'}
            <div class="rc-actions">
                <button class="btn-line" onclick="openPreview('${rep.key}')">预览</button>
                ${usable ? `<button class="btn-solid" onclick="addReport('${rep.key}')">添加</button>` : ''}
            </div>
        </div>`;
}

function renderAll() {
    const kw = searchInput.value.trim().toLowerCase();
    const list = reports.filter(function (r) {
        return !kw
            || r.name.toLowerCase().indexOf(kw) >= 0
            || r.en.toLowerCase().indexOf(kw) >= 0
            || r.desc.toLowerCase().indexOf(kw) >= 0
            || rep2match(r, kw);
    });

    if (!list.length) {
        screenEl.innerHTML = '<div class="empty-wrap">未找到匹配的报表</div>';
        return;
    }

    const groups = NATURE_ORDER
        .map(function (nat) { return { name: nat, items: list.filter(function (r) { return r.nature === nat; }) }; })
        .filter(function (g) { return g.items.length > 0; });
    const rest = list.filter(function (r) { return NATURE_ORDER.indexOf(r.nature) < 0; });
    if (rest.length) groups.push({ name: '其他', items: rest });

    screenEl.innerHTML = groups.map(function (g) {
        return '<div class="group-head"><span class="group-name">' + g.name + '</span>'
            + '<span class="group-count">' + g.items.length + ' 张报表</span></div>'
            + g.items.map(renderCard).join('');
    }).join('');
}

/* ==================== 预览面板 ==================== */
/* 口径 → 示例数据视图：单机 = 单台（含机型），机群 / 项目 = 多台 */
function scopedView(rep) {
    return rep.scope === '单机' ? 'single' : 'fleet';
}

function openPreview(key) {
    const rep = reports.filter(function (r) { return r.key === key; })[0];
    if (!rep) return;
    previewState = { key: key };
    renderPreview();
    document.getElementById('previewSheet').classList.add('active');
}

function closePreview() {
    document.getElementById('previewSheet').classList.remove('active');
}

function renderPreview() {
    const rep = reports.filter(function (r) { return r.key === previewState.key; })[0];
    const body = document.getElementById('previewBody');
    const foot = document.getElementById('previewFoot');
    document.getElementById('previewTitle').textContent = rep.name;

    if (!rep.metrics.length) {
        body.innerHTML = '<div class="na-box">该报表所需数据源尚未接入，本期不实现，暂无示例数据</div>';
        foot.innerHTML = '';
        return;
    }

    const periodRow = '<div class="kv-row"><span class="kv-k">统计周期</span><span class="kv-v">' + PERIOD + '</span></div>';
    let rowsHTML = '';

    if (scopedView(rep) === 'single') {
        rowsHTML = '<div class="kv">' + periodRow
            + '<div class="kv-row"><span class="kv-k">设备机型</span><span class="kv-v">挖掘机 SY215</span></div>'
            + '<div class="kv-row"><span class="kv-k">设备编号</span><span class="kv-v">F3S01395</span></div>'
            + deviceRows(rep, 1).map(function (r) {
                return '<div class="kv-row"><span class="kv-k">' + r.k + '</span><span class="kv-v">' + r.v + '</span></div>';
            }).join('')
            + '</div>';
    } else {
        rowsHTML = FLEET_DEVICES.map(function (id, k) {
            const devRows = deviceRows(rep, FLEET_FACTORS[k]).map(function (r) {
                return '<div class="kv-row"><span class="kv-k">' + r.k + '</span><span class="kv-v">' + r.v + '</span></div>';
            }).join('');
            return '<div class="dev-block"><div class="dev-title">' + id + '</div>'
                + '<div class="kv">' + periodRow + devRows + '</div></div>';
        }).join('');
    }

    body.innerHTML = '<div class="preview-bar">'
        + '<span class="sample-note">示例数据，仅示意展示效果</span>'
        + '</div>' + rowsHTML;

    foot.innerHTML = '<button onclick="addReport(\'' + rep.key + '\')">使用该报表</button>';
}

/* ==================== 交互 ==================== */
function addReport(key) {
    const rep = reports.filter(function (r) { return r.key === key; })[0];
    if (!rep) return;
    if (confirm('已选择报表：' + rep.name + '（' + rep.scope + '口径）\n\n将在「管理报表」页面中配置报表信息。\n是否立即前往？')) {
        location.href = '我的报表.html';
    }
}

/* 返回上一页（无历史记录时只提示一下） */
function goBack() {
    if (history.length > 1) { history.back(); return; }
    showToast('返回上一页');
}

function showToast(msg) {
    const t = document.createElement('div');
    t.textContent = msg;
    t.style.cssText = 'position:fixed;left:50%;bottom:60px;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;'
        + 'font-size:12px;padding:9px 16px;border-radius:18px;z-index:99;max-width:80%;text-align:center;';
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 1800);
}

/* ==================== 初始化 ==================== */
renderAll();
</script>
