<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>我的 - Mysany APP</title>
    <style>
        :root {
            --primary: #E60012;
            --primary-hover: #B8000E;
            --primary-light: #FDECEC;
            --success: #10B981;
            --success-light: #D1FAE5;
            --warning: #F59E0B;
            --warning-light: #FEF3C7;
            --error: #EF4444;
            --error-light: #FEE2E2;
            --text-primary: #1E293B;
            --text-secondary: #64748B;
            --text-muted: #94A3B8;
            --border: #E2E8F0;
            --border-light: #F1F5F9;
            --bg-page: #F5F5F7;
            --bg-card: #FFFFFF;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, .05);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --transition-fast: 200ms cubic-bezier(.25, .1, .25, 1);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
            font-size: 14px;
            color: var(--text-primary);
            background: var(--bg-page)
        }

        .app-page {
            width: 100%;
            max-width: 100%;
            min-height: 100vh;
            margin: 0 auto;
            overflow-x: hidden;
            background: var(--bg-page);
            position: relative;
            padding-bottom: calc(86px + env(safe-area-inset-bottom, 0px))
        }

        /* Header */
        .page-header {
            padding: 20px 16px 12px
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px
        }

        .header-logo {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -.5px
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px
        }

        .header-action-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 50%
        }

        .header-action-btn:active {
            background: var(--border-light)
        }

        /* Profile */
        .profile-card {
            margin: 0 16px 12px;
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            overflow: hidden
        }

        .profile-main {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px
        }

        .avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 700;
            flex-shrink: 0;
            position: relative
        }

        .avatar-badge {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 18px;
            height: 18px;
            background: var(--error);
            border-radius: 50%;
            border: 2px solid var(--bg-card);
            display: flex;
            align-items: center;
            justify-content: center
        }

        .avatar-badge svg {
            width: 10px;
            height: 10px;
            color: #fff
        }

        .profile-info {
            flex: 1;
            min-width: 0
        }

        .profile-name {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.3
        }

        .profile-role {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px
        }

        /* 当前订阅套餐（头像区域） */
        .profile-plan {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            padding: 4px 10px 4px 6px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 100px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity var(--transition-fast)
        }

        .profile-plan:active {
            opacity: .85
        }

        .profile-plan-icon {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0
        }

        .profile-plan-icon svg {
            width: 11px;
            height: 11px
        }

        .profile-plan-name {
            line-height: 1
        }

        .profile-plan-tag {
            font-size: 10px;
            font-weight: 600;
            background: var(--primary);
            color: #fff;
            padding: 1px 6px;
            border-radius: 100px;
            line-height: 1.5
        }

        .profile-plan-arrow {
            color: var(--primary);
            line-height: 1
        }

        .profile-switch {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            flex-shrink: 0
        }

        /* Subscription Banner */
        .sub-banner {
            margin: 0 16px 12px;
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            overflow: hidden
        }

        .sub-banner-inner {
            padding: 16px
        }

        .sub-banner-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px
        }

        .sub-banner-title {
            font-size: 15px;
            font-weight: 600
        }

        .sub-banner-title .sub-highlight {
            color: var(--primary);
            font-size: 18px;
            font-weight: 800
        }

        .sub-banner-btn {
            font-size: 13px;
            font-weight: 500;
            color: var(--primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 2px
        }

        .sub-calendar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -ms-overflow-style: none
        }

        .sub-calendar::-webkit-scrollbar { display: none }

        .cal-day {
            flex: 0 0 auto;
            text-align: center;
            padding: 4px 6px;
            min-width: 36px
        }

        .cal-date {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 4px
        }

        .cal-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--border-light);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2px;
            color: var(--text-muted)
        }

        .cal-icon.active {
            background: var(--warning-light);
            color: #D97706
        }

        .cal-icon.checked {
            background: var(--success);
            color: #fff
        }

        .cal-val {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted)
        }

        .cal-val.positive {
            color: var(--success)
        }

        .sub-cta {
            display: block;
            width: 100%;
            padding: 11px;
            font-size: 15px;
            font-weight: 600;
            border-radius: var(--radius-sm);
            cursor: pointer;
            border: none;
            background: linear-gradient(135deg, #FF7A00, #FF5500);
            color: #fff;
            text-align: center;
            transition: opacity .2s
        }

        .sub-cta:active {
            opacity: .85
        }

        /* 订阅选购卡片入口 */
        .sub-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: 0 16px 12px;
            background: linear-gradient(135deg, var(--primary), #FF4D5A);
            border-radius: var(--radius-lg);
            padding: 16px;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: opacity var(--transition-fast)
        }

        .sub-card:active {
            opacity: .9
        }

        .sub-card-left {
            flex: 1;
            min-width: 0;
            color: #fff
        }

        .sub-card-title {
            font-size: 16px;
            font-weight: 700
        }

        .sub-card-desc {
            font-size: 12px;
            opacity: .9;
            margin-top: 2px;
            line-height: 1.4
        }

        .sub-card-btn {
            flex-shrink: 0;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            background: #fff;
            color: var(--primary);
            border: none;
            border-radius: 100px;
            cursor: pointer
        }

        /* Quick Actions */
        .quick-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 0 16px 12px
        }

        .quick-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 16px 8px;
            background: var(--bg-card);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: background var(--transition-fast)
        }

        .quick-item:active {
            background: var(--border-light)
        }

        .quick-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center
        }

        .quick-icon.blue {
            background: #EFF6FF;
            color: #2563EB
        }

        .quick-icon.orange {
            background: #FFF7ED;
            color: #EA580C
        }

        .quick-icon.green {
            background: #ECFDF5;
            color: #059669
        }

        .quick-label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary)
        }

        /* Quick Menu List */
        .menu-card {
            margin: 0 16px 12px;
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            overflow: hidden
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            cursor: pointer;
            transition: background var(--transition-fast)
        }

        .menu-item:active {
            background: var(--border-light)
        }

        .menu-item+.menu-item {
            border-top: 1px solid var(--border-light)
        }

        .menu-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0
        }

        .menu-icon.blue {
            background: #EFF6FF
        }

        .menu-icon.purple {
            background: #F3E8FF
        }

        .menu-icon.orange {
            background: #FFF7ED
        }

        .menu-icon.red {
            background: #FEF2F2
        }

        .menu-icon.blue-light {
            background: #EFF6FF
        }

        .menu-icon.red-light {
            background: #FEF2F2
        }

        .menu-icon.cyan {
            background: #ECFEFF
        }

        .menu-icon.green {
            background: #ECFDF5
        }

        .menu-name {
            flex: 1;
            font-size: 14px;
            font-weight: 500
        }

        .menu-badge {
            font-size: 11px;
            font-weight: 600;
            background: var(--primary);
            color: #fff;
            padding: 2px 10px;
            border-radius: 100px
        }

        /* Stats */
        .stats-card {
            margin: 0 16px 12px;
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            overflow: hidden
        }

        .stats-header {
            padding: 14px 16px;
            font-size: 15px;
            font-weight: 600;
            border-bottom: 1px solid var(--border-light)
        }

        .stats-body {
            display: flex;
            padding: 16px
        }

        .stat-col {
            flex: 1;
            text-align: center
        }

        .stat-num {
            font-size: 26px;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1.2
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px
        }

        /* Bottom Tab Bar */
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: var(--bg-card);
            border-top: 1px solid var(--border);
            max-width: 100%;
            margin: 0 auto;
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        .tab-list {
            display: flex;
            list-style: none;
            padding: 0;
            margin: 0
        }

        .tab-item {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            padding: 6px 0 4px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            position: relative;
            font-family: inherit;
            font-size: 10px
        }

        /* 多语言下底部导航文案变长：单行省略号，不撑破底栏 */
        .tab-item > span {
            max-width: 100%;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center
        }

        .tab-item.active {
            color: var(--primary)
        }

        .tab-icon {
            width: 24px;
            height: 24px
        }

        .tab-dot {
            position: absolute;
            top: 2px;
            right: calc(50% - 18px);
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--error);
            border: 2px solid var(--bg-card)
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 56px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 100%;
            background: #1E293B;
            color: #fff;
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            text-align: center;
            z-index: 300;
            animation: toastIn .2s;
            pointer-events: none;
            display: none
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(-6px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .toast.visible {
            display: block
        }

        /* 告警通知横幅（站内信通知展示） */
        .alarm-banner {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            padding-top: calc(12px + env(safe-area-inset-top, 0px));
            background: linear-gradient(135deg, #E60012, #FF4D5A);
            color: #fff;
            box-shadow: 0 4px 20px rgba(230, 0, 18, .35);
            transform: translateY(-110%);
            transition: transform .35s cubic-bezier(.32, .72, 0, 1);
            pointer-events: none
        }

        .alarm-banner.show {
            transform: translateY(0);
            pointer-events: auto
        }

        .alarm-icon {
            width: 34px;
            height: 34px;
            flex-shrink: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, .2);
            display: flex;
            align-items: center;
            justify-content: center
        }

        .alarm-icon svg {
            width: 20px;
            height: 20px;
            color: #fff
        }

        .alarm-info {
            flex: 1;
            min-width: 0
        }

        .alarm-title {
            font-size: 15px;
            font-weight: 700;
            line-height: 1.3;
            display: flex;
            align-items: center;
            gap: 6px
        }

        .alarm-tag {
            font-size: 10px;
            font-weight: 700;
            background: #fff;
            color: #E60012;
            padding: 1px 6px;
            border-radius: 100px;
            line-height: 1.5;
            flex-shrink: 0
        }

        .alarm-desc {
            font-size: 12px;
            opacity: .92;
            margin-top: 2px;
            line-height: 1.4;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical
        }

        .alarm-time {
            font-size: 11px;
            opacity: .85;
            flex-shrink: 0;
            align-self: flex-start;
            margin-top: 2px
        }

        .alarm-close {
            width: 24px;
            height: 24px;
            border: none;
            background: rgba(255, 255, 255, .2);
            border-radius: 50%;
            color: #fff;
            font-size: 14px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0
        }

        *:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px
        }

        /* ================= 上新引导（每次刷新页面出现一次） ================= */
        .nf-mask {
            position: fixed;
            inset: 0;
            z-index: 600;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0 24px;
            background: rgba(15, 18, 32, .55);
            -webkit-backdrop-filter: blur(2px);
            backdrop-filter: blur(2px)
        }

        .nf-mask.show {
            display: flex
        }

        .nf-card {
            width: 100%;
            max-width: 320px;
            background: var(--bg-card);
            border-radius: 20px;
            padding: 26px 22px 18px;
            text-align: center;
            box-shadow: 0 20px 48px rgba(0, 0, 0, .28);
            animation: nfIn .28s cubic-bezier(.16, 1, .3, 1)
        }

        @keyframes nfIn {
            from {
                opacity: 0;
                transform: translateY(14px) scale(.96)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        .nf-ico {
            width: 76px;
            height: 76px;
            margin: 0 auto;
            border-radius: 24px;
            background: linear-gradient(158deg, #FFFFFF 0%, var(--primary-light) 100%);
            border: 1px solid #F3E7E9;
            display: flex;
            align-items: center;
            justify-content: center
        }

        .nf-badge {
            display: inline-block;
            margin-top: 16px;
            padding: 3px 10px;
            border-radius: 100px;
            background: var(--primary-light);
            color: var(--primary);
            font-size: 11px;
            font-weight: 600
        }

        .nf-title {
            margin-top: 10px;
            font-size: 17px;
            font-weight: 700;
            color: var(--text-primary)
        }

        .nf-desc {
            margin-top: 9px;
            font-size: 13px;
            line-height: 1.7;
            color: var(--text-secondary)
        }

        .nf-btn {
            width: 100%;
            margin-top: 22px;
            padding: 13px 0;
            border: none;
            border-radius: 24px;
            background: var(--primary);
            color: #fff;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(230, 0, 18, .24);
            transition: background var(--transition-fast)
        }

        .nf-btn:hover {
            background: var(--primary-hover)
        }

        .nf-btn:active {
            transform: scale(.99)
        }

        .nf-later {
            width: 100%;
            margin-top: 4px;
            padding: 10px 0;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-family: inherit;
            font-size: 13px;
            cursor: pointer
        }

        /* 新功能提示小圆点：挂在对应入口的图标右上角 */
        .quick-icon.new-flag,
        .menu-icon.new-flag {
            position: relative
        }

        .quick-icon.new-flag::after,
        .menu-icon.new-flag::after {
            content: '';
            position: absolute;
            top: -1px;
            right: -1px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary);
            box-shadow: 0 0 0 2px var(--bg-card)
        }
    </style>
</head>

<body>

    <div class="app-page">

        <!-- Header -->
        <div class="page-header">
            <div class="header-top">
                <div class="header-logo">MySANY</div>
                <div class="header-actions">
                    <button class="header-action-btn" title="客服" onclick="showToast('正在连接在线客服...')">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                        </svg>
                    </button>
                    <button class="header-action-btn" title="设置" onclick="location.href='设置.html'">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <circle cx="12" cy="12" r="3" />
                            <path
                                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09z" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Profile -->
        <div class="profile-card">
            <div class="profile-main">
                <div class="avatar">阿

    <script>
        // ===== 日历条渲染 =====
        (function buildCalendar() {
            const strip = document.getElementById('cal-strip');
            const days = ['8.15', '8.16', '8.17', '8.18', '8.19', '8.20', '今天'];
            const icons = ['star', 'star', 'star', 'star', 'checked', 'active', 'star'];
            const vals = ['+0', '+0', '+0', '+0', '', '+10', '+0'];
            let html = '';
            for (let i = 0; i < days.length; i++) {
                const iconType = icons[i];
                let iconSvg = '';
                if (iconType === 'star' || iconType === 'active') {
                    iconSvg = '<svg width="12" height="12" viewBox="0 0 24 24" fill="' + (iconType === 'active' ? '#D97706' : 'none') + '" stroke="' + (iconType === 'active' ? '#D97706' : '#94A3B8') + '" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';
                } else if (iconType === 'checked') {
                    iconSvg = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
                }
                html += '<div class="cal-day">' +
                    '<div class="cal-date">' + days[i] + '</div>' +
                    '<div class="cal-icon ' + iconType + '">' + iconSvg + '</div>' +
                    '<div class="cal-val ' + (vals[i].includes('+') ? 'positive' : '') + '">' + vals[i] + '</div>' +
                    '</div>';
            }
            strip.innerHTML = html;
        })();

        function goSubscribe() { window.location.href = '版本选购页.html'; }

        const FLEET_VISITED_KEY = 'mysany_fleet_report_visited';
        function fleetReportVisited() {
            try { return !!localStorage.getItem(FLEET_VISITED_KEY); } catch (e) { return false; }
        }
        // 给所有标了 data-new-flag="fleet" 的入口按访问记录挂 / 摘角标
        function syncFleetNewFlag() {
            const on = !fleetReportVisited();
            document.querySelectorAll('[data-new-flag="fleet"]').forEach(el => el.classList.toggle('new-flag', on));
        }
        // 记录已访问 + 立刻摘掉角标（不依赖跳转后的新页面）
        function markFleetReportVisited() {
            try { localStorage.setItem(FLEET_VISITED_KEY, '1'); } catch (e) {}
            document.querySelectorAll('[data-new-flag="fleet"]').forEach(el => el.classList.remove('new-flag'));

            { module: '商务与报价', scene: '配件报价',
              content: '您有一笔配件询价需要您确认报价，询价单号：${orderNo}，点击查看立即确认' },
            { module: '商务与报价', scene: '工单报价',
              content: '您的服务工单（工单编号：${orderNo}）预报价已生成，可查看报价明细' },
            { module: '客户反馈与评价', scene: '反馈管理',
              content: '您提交的反馈（反馈编号：${feedbackNo}）处理状态已更新，可查看详情' },
            { module: '客户反馈与评价', scene: '反馈管理',
              content: '您的反馈内容与状态已更新，可查看最新处理进展' },
            { module: '客户反馈与评价', scene: '投诉管理',
              content: '您的投诉／建议／咨询编号：${complaintNo}已创建，感谢您的投诉／建议／咨询，我们将尽快处理您的问题，并尽快回复您' },
            { module: '客户反馈与评价', scene: '满意度回访',
              content: '服务已完成，诚邀您参与满意度回访，您的评价对我们很重要' },
            { module: '其他消息', scene: '认证管理',
              content: '客户自动认证流程已完成，相关权限已开通' },
            { module: '其他消息', scene: '物流状态',
              content: '您的货物已到达指定仓库（ARWH），可查看后续物流进度' },
            { module: '其他消息', scene: '物流状态',
              content: '您的货物已离开指定仓库（LVWH），正在运输途中' }
        ];

        // 示例占位符数据（正式环境中替换为真实业务数据）
        const SAMPLE_DATA = {
            deviceNo: 'SY300-001',
            orderNo: 'WO20260901-001',
            railName: '长株潭施工区',
            railRule: '驶入',
            feedbackNo: 'FB20260901-001',
            complaintNo: 'TS20260901-001'
        };

        let demoIdx = 0;

        // 替换 ${xxx} 与 {xxx} 两种占位符形式
        function renderTemplate(content) {
            return content.replace(/\$\{(\w+)\}|{(\w+)}/g, (m, a, b) => SAMPLE_DATA[a || b] || m);
        }

        // 按模板轮询生成下一条通知（演示数据）
        function nextNotification() {
            const tpl = TEMPLATES[demoIdx % TEMPLATES.length];
            demoIdx++;
            return {
                title: tpl.title || tpl.scene,
                module: tpl.module,
                content: renderTemplate(tpl.content),
                time: new Date().toLocaleTimeString('zh-CN', { hour12: false })
            };
        }

        // 展示通知横幅（顶部红色横幅，8 秒自动消失）
        function showNotification(msg) {
            document.getElementById('alarmTitle').textContent = msg.title || '新消息提醒';
            const tag = document.getElementById('alarmModule');
            if (tag) tag.textContent = msg.module || '';
            document.getElementById('alarmDesc').textContent = msg.content || '';
            const t = document.getElementById('alarmTime');
            if (t) t.textContent = msg.time || '';
            const banner = document.getElementById('alarmBanner');
            banner.classList.remove('show');
            void banner.offsetWidth; // 强制重排，重播下滑动画
            banner.classList.add('show');
            clearTimeout(alarmHideTimer);
            alarmHideTimer = setTimeout(closeAlarmBanner, 8000);
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]); // 手机震动提醒
        }

        function closeAlarmBanner() {
            document.getElementById('alarmBanner').classList.remove('show');
        }

        // 启动演示：先连续推送 3 条（模拟连收多条站内信），之后每 6 秒轮播一条
        setTimeout(() => {
            showNotification(nextNotification()); // 第 1 条
            setTimeout(() => showNotification(nextNotification()), 1600); // 第 2 条
            setTimeout(() => showNotification(nextNotification()), 3200); // 第 3 条
        }, 1200);
        setInterval(() => showNotification(nextNotification()), 6000);

        // ===== 上新引导：机群报表功能预告（刷新页面时出现一次）=====
        (function showNewFeatureGuide() {
            const mask = document.getElementById('newFeatureMask');
            if (!mask) return;
            setTimeout(() => mask.classList.add('show'), 400);
        })();

        function closeNewFeatureGuide() {
            document.getElementById('newFeatureMask').classList.remove('show');
        }

        function goNewFeatureApply() {
            window.location.href = '我需要更多报表.html';
        }
    </script>
</body>

</html>
