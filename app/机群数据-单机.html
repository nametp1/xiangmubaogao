<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>机群数据-单机</title>
<style>
    /* ========================================================================
     * 字号等级（全页只用这 6 档 + 弹层滚轮 1 档，避免大小混乱）
     *   11 = 辅助（角标 / 轴标 / 单位 / 副行 / caret / 图例）
     *   12 = 次要（表头 / KPI 标签 / 说明条 / 快速入口 / 图例文字）
     *   14 = 正文（周期 Tab / 明细表值 / 按钮 / 弹层类型）
     *   15 = 小标题（卡片标题 / 日期 / 弹层标题与按钮 / 型号）
     *   18 = 页面级标题（顶栏页名 / 设备标题）
     *   22 = 强调数字（KPI）
     *   17 = 弹层滚轮值（仅此处，视觉需要）
     * ====================================================================== */
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
        font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
        background: #eef0f3; color: #1a1a1a; height: 100vh; overflow: hidden;
        display: flex; flex-direction: column;
    }
    /* 关掉「双击放大」：touch-action: manipulation 只禁双击缩放，
       双指捏合与滑动照旧（iOS Safari 会忽略 user-scalable=no，所以用这个更靠谱） */
    html, body { touch-action: manipulation; }
    button, input, label, a { touch-action: manipulation; }
    /* ================= 顶部导航（三页统一：返回 + 页面标题＝当前 tab；三个 tab 可相互点击切换） ================= */
    .topbar {
        height: 52px; background: #fff; border-bottom: 1px solid #e8e8e8; flex-shrink: 0;
        display: flex; align-items: center; padding: 0 12px;
    }
    .topbar-back {
        width: 30px; height: 30px; flex-shrink: 0; border: none; background: transparent;
        border-radius: 50%; color: #1a1a1a; font-size: 18px; line-height: 1; font-family: inherit;
        display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .topbar-back:hover { background: #f2f3f5; }
    /* 顶栏右侧「分享」：与左侧返回键同为 30px，标题因此仍居中 */
    .share-btn {
        width: 30px; height: 30px; flex-shrink: 0; border: none; background: transparent;
        border-radius: 50%; color: #1a1a1a; cursor: pointer; font-family: inherit;
        display: flex; align-items: center; justify-content: center;
    }
    .share-btn:hover { background: #f2f3f5; }

    /* ================= 分享面板（两步：选方式 → 分享图） ================= */
    /* 覆盖 .picker-sheet 的 56vh 固定高（同权重靠后写会输 → 用双类名提高权重） */
    .picker-sheet.share-sheet { height: auto; max-height: 88vh; }
    .share-view { display: none; }
    .share-sheet.mode-methods .share-methods { display: block; }
    /* 第一步：圆形图标项（对齐拼多多 / 淘宝分享面板） */
    .share-head { padding: 18px 16px 4px; text-align: center; font-size: 14px; color: #8b90a0; }
    .share-grid { display: flex; justify-content: center; gap: 48px; padding: 10px 8px 6px; }
    .share-item {
        border: none; background: transparent; font-family: inherit; cursor: pointer;
        display: flex; flex-direction: column; align-items: center; gap: 9px; padding: 6px 4px;
    }
    .share-ico {
        width: 54px; height: 54px; border-radius: 50%; color: #fff;
        display: flex; align-items: center; justify-content: center; transition: transform .12s;
    }
    .share-item:active .share-ico { transform: scale(.93); }
    /* 静态占位项（如未接入的 WhatsApp）：整块不可点、无按压反馈 */
    .share-item.is-static { pointer-events: none; cursor: default; }
    .ico-link { background: #2b6cff; }      /* 分享图片 */
    .ico-whatsapp { background: #25D366; }    /* WhatsApp */
    .share-label { font-size: 12px; color: #5a6472; }
    .share-cancel {
        display: block; width: 100%; margin-top: 10px; border: none; border-top: 1px solid #f2f3f6;
        background: #fff; padding: 16px 0; font-family: inherit; font-size: 15px; color: #5a6472; cursor: pointer;
        padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    }
    .share-cancel:hover { background: #fafbfc; }
    /* 顶栏标题＝当前访问的报表名称；左右各 30px（返回键 / 等宽占位）→ 真正居中，长名字省略号 */
    .page-title {
        flex: 1 1 auto; min-width: 0; text-align: center;
        font-size: 18px; font-weight: 600; color: #161a2e; letter-spacing: .2px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    /* ================= 机群数据内容（铺满，内部自己滚） ================= */
    .phone {
        flex: 1 1 auto; min-width: 0; min-height: 0; background: #f4f5f7;
        display: flex; flex-direction: column;
    }
    /* ================= 顶部区块（设备 + 周期 + 日期，统一白底） ================= */
    .top-block { background: #fff; border-bottom: 1px solid #eef0f3; flex-shrink: 0; }
    .app-header { padding: 6px 16px 0; }
    .app-header-top { display: flex; align-items: center; gap: 6px; height: 42px; }
    /* 设备头像：圆形底 + 线性设备图标（挖掘机 / 装载机 / 宽体车 / 起重机） */
    .dev-avatar {
        width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
        background: #fdecee; color: #E60012;
        display: inline-flex; align-items: center; justify-content: center;
    }
    .dev-avatar svg { width: 19px; height: 19px; }
    .app-title {
        flex: 0 1 auto; min-width: 0; font-size: 18px; font-weight: 600; color: #161a2e;
        letter-spacing: .2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .app-title-caret { flex-shrink: 0; font-size: 11px; color: #8b90a0; cursor: pointer; }
    /* ================= 周期 Tab ================= */
    .period-tabs {
        margin: 8px 16px 14px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    }
    .period-tab {
        border: none; background: #f4f5f7; padding: 10px 0; border-radius: 22px;
        font-size: 14px; color: #666; font-family: inherit; cursor: pointer; transition: all .18s;
    }
    .period-tab.active { background: #161a2e; color: #fff; font-weight: 600; }
    .period-tab:hover:not(.active) { background: #fdecee; color: #E60012; }
    /* ================= 日期切换（与设备选择同一行，靠右） ================= */
    /* 查询时间行：紧跟在周期 Tab 之后，右对齐小字 */
    .range-line {
        display: flex; align-items: center; justify-content: flex-end; gap: 2px;
        margin: 2px 4px -2px;
    }
    .range-line .date-main {
        font-size: 12.5px; color: #5a6472; font-weight: 500;
        display: inline-flex; align-items: center; gap: 4px;
    }
    .range-line .date-nav { color: #8b90a0; }
    .date-inline {
        margin-left: auto; flex-shrink: 0; display: flex; align-items: center; gap: 2px;
    }
    .date-nav {
        width: 28px; height: 28px; border: none; background: transparent; border-radius: 50%;
        font-size: 17px; color: #333; cursor: pointer; font-family: inherit; line-height: 1;
        display: flex; align-items: center; justify-content: center; padding: 0;
    }
    .date-nav:hover:not(:disabled) { background: #f4f5f7; color: #E60012; }
    .date-nav:disabled { color: #d2d5db; cursor: not-allowed; }
    .date-main {
        font-size: 15px; font-weight: 700; letter-spacing: .2px; cursor: pointer;
        color: #161a2e; white-space: nowrap; padding: 0 2px;
    }
    .date-main .caret { font-size: 11px; margin-left: 4px; color: #8b90a0; }
    /* ================= 内容区 ================= */
    /* ================= 首屏加载效果：骨架屏（刷新 / 首次进入） ================= */
    /* 遮罩只盖内容区（top 由 JS 设成 #screen 的起点），顶部标题等信息照常可见 */
    .loading-mask {
        position: fixed; left: 0; right: 0; bottom: 0; top: 52px; z-index: 70;
        background: #eef0f3; overflow: hidden; opacity: 1; transition: opacity .3s ease;
    }
    .sk-cards { padding: 14px 0 28px; }
    /* ================= 下拉刷新（整页可下拉；指示条浮在数据卡片区域上方，不挤页面） ================= */
    .ptr-layer {
        position: fixed; left: 0; right: 0; top: 0; bottom: 0;   /* top 由 JS 对齐 #screen 起点 */
        pointer-events: none; overflow: hidden; z-index: 60;
    }
    .ptr {
        position: absolute; left: 0; right: 0; top: 0; height: 46px;
        display: flex; align-items: center; justify-content: center; gap: 6px;
        color: #8b90a0; font-size: 12px;
        opacity: 0; transform: translateY(-46px);
        transition: opacity .16s ease, transform .16s ease;
    }
    .ptr svg { transition: transform .16s ease; }
    .ptr.ready svg { transform: rotate(180deg); }
    .ptr.loading svg { animation: ptrSpin .8s linear infinite; }
    @keyframes ptrSpin { to { transform: rotate(360deg); } }
    /* 拖动中跟手（无过渡），松手后回弹（有过渡） */
    body.ptr-dragging .ptr, body.ptr-dragging .screen { transition: none; }
    .loading-mask.hide { opacity: 0; pointer-events: none; }
    /* 灰块 + 微光流动 */
    .sk-block, .sk-bars i {
        display: block; border-radius: 6px;
        background: linear-gradient(90deg, #f1f3f6 25%, #e5e8ed 37%, #f1f3f6 63%);
        background-size: 400% 100%;
        animation: skShimmer 1.4s ease infinite;
    }
    @keyframes skShimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
    /* 卡片：指标卡 / 图形卡 / 明细表卡（按配置生成） */
    .sk-card { background: #fff; border-radius: 16px; padding: 16px; margin: 0 16px 12px; box-shadow: 0 1px 3px rgba(22,26,46,.05); }
    .sk-head { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
    .sk-ctitle { width: 84px; height: 15px; }
    .sk-cnote { width: 40px; height: 11px; }
    .sk-kpi { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 20px 8px; }
    .sk-kpi-col { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .sk-v { width: 76px; height: 22px; }
    .sk-l { width: 84px; height: 11px; }
    .sk-bars { display: flex; align-items: flex-end; gap: 9px; height: 132px; }
    .sk-bars i { flex: 1; }
    .sk-bars i:nth-child(1) { height: 44%; }
    .sk-bars i:nth-child(2) { height: 62%; }
    .sk-bars i:nth-child(3) { height: 53%; }
    .sk-bars i:nth-child(4) { height: 74%; }
    .sk-bars i:nth-child(5) { height: 47%; }
    .sk-bars i:nth-child(6) { height: 68%; }
    .sk-bars i:nth-child(7) { height: 58%; }
    .sk-rows { display: grid; grid-template-columns: 1.2fr repeat(4, 1fr); gap: 8px 6px; }
    .sk-rows .sk-block { height: 30px; }
    @media (prefers-reduced-motion: reduce) { .sk-block, .sk-bars i { animation: none; } }

    /* 内容区：下拉刷新时整体下移（transform 由 JS 设置）；overscroll-contain 防止滚动链到外层 */
    .screen {
        flex: 1; overflow-y: auto; padding: 14px 16px 28px; transition: transform .2s ease;
        overscroll-behavior-y: contain;
    }
    .card {
        background: #fff; border-radius: 16px; padding: 16px; margin-bottom: 12px;
        box-shadow: 0 1px 3px rgba(22,26,46,.05);
    }
    .card-title {
        display: flex; align-items: center; gap: 7px; white-space: nowrap;
        font-size: 15px; font-weight: 700; color: #161a2e; margin-bottom: 16px;
    }
    .card-title::before { content: ''; width: 3px; height: 13px; border-radius: 2px; background: #E60012; }
    /* 卡片标题右侧的口径说明（如「近 7 日（含当日）」） */
    .card-title .card-note {
        margin-left: 2px; font-size: 11px; font-weight: 400; color: #a0a4ad;
        overflow: hidden; text-overflow: ellipsis;   /* 说明过长时省略，标题始终单行 */
    }

    /* 三列指标 */
    /* 指标区标题（KPI 条上方） */
    .strip-title {
        display: flex; align-items: center; gap: 6px;
        margin: 12px 4px 8px; font-size: 13px; font-weight: 600; color: #161a2e;
    }
    .strip-title::before {
        content: ''; width: 3px; height: 13px; border-radius: 2px; background: #E60012;
    }
    .kpi-strip {
        display: grid; grid-template-columns: repeat(2, 1fr);
        background: #fff; border-radius: 16px; padding: 16px 8px 20px; margin-bottom: 12px;
        box-shadow: 0 1px 3px rgba(22,26,46,.05);
    }
    /* 卡片内标题：数据汇总统计（跨两列） */
    .kpi-title {
        grid-column: 1 / -1; display: flex; align-items: center; gap: 6px;
        font-size: 13px; font-weight: 600; color: #161a2e;
        padding: 0 10px; margin-bottom: 14px;
    }
    .kpi-title::before {
        content: ''; width: 3px; height: 13px; border-radius: 2px; background: #E60012;
    }
    .kpi { text-align: center; border-right: 1px solid #f2f3f6; }
    .kpi:last-child { border-right: none; }
    .kpi-value { font-size: 22px; font-weight: 800; color: #161a2e; line-height: 1.1; letter-spacing: -.2px; }
    .kpi-value small { font-size: 12px; font-weight: 600; color: #8b90a0; margin-left: 3px; letter-spacing: 0; }
    .kpi-label { font-size: 12px; color: #8b90a0; margin-top: 8px; }

    /* 迷你柱状图（能耗分析 / 工时统计共用）：x 轴=时间、y 轴=数字刻度（最大值均分 6 等份）
       结构：.chart-y（刻度）/ .chart-plot（网格 + 柱 + 时间标签），左右同一套行高保证对齐 */
    .chart-wrap { position: relative; display: flex; gap: 6px; }
    /* y 轴顶部的单位标签（带具体指标，如「总工时（h）」）
       —— 宽度自适应、左对齐起排：标签比刻度列宽，写死 40px 会把它挤到卡片外面 */
    .chart-unit {
        position: absolute; left: 0; top: 24px; width: auto; text-align: left; white-space: nowrap;
        font-size: 11px; color: #a0a4ad; line-height: 1;
    }
    .chart-y {
        flex: 0 0 40px; display: flex; flex-direction: column; justify-content: space-between;
        padding: 44px 0 48px; text-align: right; font-size: 11px; color: #a0a4ad; line-height: 1;
    }
    .chart-plot { position: relative; flex: 1; min-width: 0; height: 220px; }
    /* 绘图区：上留 44px 给「柱顶数值 + 悬停气泡」、下留 48px 给斜排时间标签
       （2026-10-09 修：斜排标签绕中心旋转后包围盒会上下各长出 ~1/2 宽度·sinθ，
        原来 44px + 顶部对齐会让标签顶部压进绘图区、盖住柱子 → 改为 48px + 垂直居中） */
    .chart-area { position: absolute; left: 0; right: 0; top: 44px; bottom: 48px; }
    .chart-grid { position: absolute; inset: 0; pointer-events: none; }
    .chart-grid i { position: absolute; left: 0; right: 0; border-top: 1px dashed #eceef2; }
    .chart-grid i.top { border-top-style: solid; border-top-color: #e3e6ec; }
    .chart-bars {
        position: absolute; inset: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 10px; align-items: end;
    }
    .chart-col { position: relative; display: flex; align-items: flex-end; justify-content: center; height: 100%; }
    /* 数值浮在柱顶（绝对定位 → 不占柱子高度，最高柱才能正好顶到峰值线） */
    .chart-bar { position: relative; width: 62%; background: #E60012; border-radius: 6px 6px 0 0; min-height: 3px; }
    /* 折线图：连接线（SVG，非等比缩放但描边不缩放）+ 数据点圆点 */
    /* 必须显式给宽高：SVG 不给尺寸时会按 viewBox 比例撑成正方形，折线就被纵向拉伸了 */
    .chart-line {
        position: absolute; inset: 0; width: 100%; height: 100%;
        display: block; overflow: visible; pointer-events: none;
    }
    .chart-line path {
        fill: none; stroke: #E60012; stroke-width: 2;
        stroke-linejoin: round; stroke-linecap: round;
    }
    /* 折线图不要栏间距：格子中心正好等于曲线的 x 坐标，圆点才落在线上 */
    .chart-bars.line-mode { gap: 0; }
    .chart-dot {
        position: absolute; left: 50%; width: 10px; height: 10px; box-sizing: border-box;
        transform: translate(-50%, 50%); border-radius: 50%;
        background: #fff; border: 2px solid #E60012;
    }
    .chart-dot.ghost { background: transparent; border-color: transparent; }
    .chart-val {
        position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
        margin-bottom: 3px; font-size: 11px; color: #8b90a0; white-space: nowrap;
    }
    /* 列宽只够放一半标签时：相邻柱的数值错开一行（横距翻倍），全部数值都能标且不压叠 */
    .chart-val.stag { margin-bottom: 20px; }        /* 错行高度：大于标签行高，两行之间留出净空 */
    /* 悬停 / 点击柱子时弹出的明细气泡（悬停走 CSS，点击走 .tip-on，移动端可用） */
    .chart-tip {
        position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
        margin-bottom: 6px; padding: 5px 9px; border-radius: 7px;
        background: rgba(22,26,46,.93); color: #fff;
        font-size: 11px; line-height: 1.45; text-align: left; white-space: nowrap;
        display: none; z-index: 6; pointer-events: none;
        box-shadow: 0 4px 14px rgba(22,26,46,.24);
    }
    .chart-tip::after {
        content: ''; position: absolute; left: 50%; bottom: -4px; margin-left: -4px;
        border: 4px solid transparent; border-top-color: rgba(22,26,46,.93); border-bottom: none;
    }
    /* 时间：大字加粗（与数值互换字号 / 粗细）；数值：小字淡一档 */
    .chart-tip .t-s { display: block; font-size: 12px; font-weight: 700; }
    .chart-tip .t-v { font-size: 10px; font-weight: 400; opacity: .78; }
    /* 首 / 末两格气泡贴边对齐，避免顶出卡片 */
    .chart-col.edge-l .chart-tip { left: 0; transform: none; }
    .chart-col.edge-l .chart-tip::after { left: 18px; margin-left: 0; }
    .chart-col.edge-r .chart-tip { left: auto; right: 0; transform: none; }
    .chart-col.edge-r .chart-tip::after { left: auto; right: 14px; margin-left: 0; }
    .chart-col:hover .chart-tip, .chart-col.tip-on .chart-tip { display: block; }
    .chart-col:hover .chart-val, .chart-col.tip-on .chart-val { visibility: hidden; }
    .chart-x {
        position: absolute; left: 0; right: 0; bottom: 0; height: 48px;
        /* 左右各留 8px：斜排标签的左右伸展落在留白里，不会顶出卡片；垂直居中避免压柱子 */
        padding: 0 8px;
        display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; align-items: center;
        font-size: 11px; color: #a0a4ad; letter-spacing: -.2px;
    }
    /* 时间标签：默认水平排（每格放得下就水平排）；放不下才加 .tilt 斜排 40°
       —— 与《折线图节点密度示例》一致：角度由「标签宽度 vs 每格宽度」决定，而不是一律斜排 */
    /* 标签盒＝贴文字宽 + 居中压在自己的刻度上（关键）：
       盒子若跟着格子宽走，手机端只有 ~19px，中文设备名（57~66px）会从格子右侧溢出，
       再绕盒子中心旋转就会和相邻标签交叉成一团 —— 斜排标签最常见的坑 */
    .chart-x span {
        display: block; width: max-content; justify-self: center;
        text-align: center; white-space: nowrap;
    }
    .chart-x span.tilt { transform: rotate(-40deg); transform-origin: center; }
    /* 更窄的机器：角度与字号再收一点，避免标签顶到边上 */
    @media (max-width: 380px) {
        .chart-x { gap: 6px; }
        .chart-x span.tilt { font-size: 10px; transform: rotate(-30deg); }
    }

    /* ================= 气泡锚点（悬停出气泡，点按可钉住） ================= */
    .tp { position: relative; }
    .tp:hover > .chart-tip, .tp.tip-on > .chart-tip { display: block; }
    /* 悬停 / 点住的那一格加一条淡底纹，提示当前在哪一格 */
    .chart-col.tp::before {
        content: ''; position: absolute; left: 0; right: 0; top: 0; bottom: 0;
        border-radius: 6px; background: rgba(22,26,46,.05);
        opacity: 0; transition: opacity .15s; pointer-events: none;
    }
    .chart-col.tp:hover::before, .chart-col.tp.tip-on::before { opacity: 1; }
    /* 折线：悬停「整格」→ 宽气泡按图例顺序列出该格所有指标的数值（一格一次，不逐点弹） */
    /* 折线整格气泡：竖向以绘图区中线为准（10 台时盒子比绘图区还高，
       顶部对齐会顶出图外）—— 左右两端仍贴边，只保留纵向居中 */
    .chart-bars.line-mode .chart-tip { top: 50%; bottom: auto; margin-bottom: 0; transform: translate(-50%, -50%); }
    .chart-bars.line-mode .tp.edge-l > .chart-tip { left: 0; transform: translateY(-50%); }
    .chart-bars.line-mode .tp.edge-r > .chart-tip { left: auto; right: 0; transform: translateY(-50%); }
    .chart-tip.tip-wide { min-width: 228px; padding: 8px 12px; }
    /* 一格里的设备：单列竖排、全部列出（不分左右两列，读起来不跳）；
       11px 字 + 2px 行距，10 行也能装进绘图区，不像原来 10px/1px 那样挤 */
    .tip-list { display: grid; grid-template-columns: 1fr; gap: 0; margin-top: 5px; }
    .tip-row { display: flex; align-items: center; gap: 6px; font-size: 11px; line-height: 1.5; white-space: nowrap; }
    .tip-row .lg-dot { width: 7px; height: 7px; }
    .tip-row .tip-name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; opacity: .85; }
    .tip-row .tip-val { flex: 0 0 auto; font-weight: 600; font-variant-numeric: tabular-nums; }
    .tip-sum {
        display: block; margin-top: 5px; padding-top: 5px;
        border-top: 1px solid rgba(255,255,255,.18); font-size: 11px; opacity: .85;
    }
    /* ================= 折线图图例（多指标：名称 + 颜色点） ================= */
    .chart-legend { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-bottom: 10px; font-size: 11px; color: #5a6472; }
    .lg-item { display: inline-flex; align-items: center; gap: 4px; }
    .lg-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    /* ================= 水平条形图（与垂直柱状图同数据、换方向；条端标数值） ================= */
    .rank-list { display: flex; flex-direction: column; gap: 10px; }
    .rank-row { display: flex; align-items: center; gap: 8px; }
    .rank-row .rk-name {
        flex: 0 0 auto; font-size: 12px; color: #5a6472;   /* 列宽由 JS 按最宽标签给（见 rankChartHTML） */
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    /* 条 + 数值 + 隐形占位：条与占位按比例分配「轨宽 − 数值宽」→ 数值紧贴条尾，
       最大值那条的数值正好落在行右端，右侧零残留空白 */
    .rank-row .rk-track { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; }
    .rank-row .rk-bar { height: 12px; min-width: 2px; border-radius: 6px; background: #E60012; }
    .rank-row .rk-gap { height: 0; }                 /* 隐形占位（只参与分配宽度） */
    .rank-row .rk-val { flex: 0 0 auto; font-size: 11px; color: #8b90a0; white-space: nowrap; }
    /* ================= 环形占比图（工时构成） ================= */
    .ring-wrap { position: relative; display: flex; align-items: center; gap: 16px; }
    .ring-wrap .chart-tip { bottom: auto; top: 0; left: 0; transform: none; }   /* 气泡挂整块环形区 */
    .ring-wrap.tip-on .chart-tip { display: block; }
    .ring-wrap .ring-arc { cursor: pointer; transition: stroke-width .16s; }
    .ring-wrap .ring-arc:hover { stroke-width: 8; }
    .ring { position: relative; flex: 0 0 120px; width: 120px; height: 120px; }
    .ring svg { width: 100%; height: 100%; display: block; }
    .ring-center {
        position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 3px;
    }
    .ring-center b { font-size: 17px; font-weight: 700; color: #161a2e; letter-spacing: -.2px; }
    .ring-center span { font-size: 10px; color: #8b90a0; }
    .ring-legend { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 7px; }
    .ring-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #5a6472; }
    .ring-item i { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .ring-item .ri-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ring-item .ri-val { font-size: 11px; color: #8b90a0; white-space: nowrap; }

    .list-block { background: #fff; border-radius: 12px; overflow: hidden; }
    /* 表头：每个单元格独立浅色块（与设计稿一致） */
    .list-head {
        display: grid; font-size: 12px; padding: 10px; gap: 6px; align-items: stretch;
        background: #fff; border-bottom: 1px solid #eef1f5;
    }
    .list-head > span {
        background: #eef2f7; color: #3d4757; font-weight: 600;
        padding: 9px 8px; border-radius: 4px; line-height: 1.35;
        display: flex; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .list-head > .num { justify-content: center; }          /* 数值列表头居中，与数据行一致 */
    .list-row {
        display: grid; font-size: 14px; padding: 12px; border-bottom: 1px solid #f2f4f7; color: #444; gap: 6px;
        align-items: center;
    }
    .list-row:last-child { border-bottom: none; }
    .list-row .num, .list-head .num { text-align: center; }  /* 数值列居中（表头 / 数据行同一套） */
    /* 合计行 */
    .list-total {
        display: grid; font-size: 14px; padding: 12px; gap: 6px; align-items: center;
        background: #fafbfc; border-top: 1px solid #eef1f5; color: #161a2e; font-weight: 700;
    }
    .list-total .num { text-align: center; }
    /* 周期明细：表头 + 行 + 合计放进横向滚动区（列宽固定，窄屏整表可左右拖动） */
    .list-scroll {
        overflow-x: auto; overflow-y: hidden; overscroll-behavior-x: contain;
        cursor: grab; scrollbar-width: none; -ms-overflow-style: none;
    }
    .list-scroll::-webkit-scrollbar { display: none; }
    .list-scroll.dragging { cursor: grabbing; }
    .list-scroll.dragging * { -webkit-user-select: none; user-select: none; }
    .list-scroll > .list-head,
    .list-scroll > .list-row,
    .list-scroll > .list-total { width: max-content; min-width: 100%; }
    /* 首列「周期」冻结：左右拖动时钉在最左侧 */
    .list-scroll > .list-head > span:first-child,
    .list-scroll > .list-row > span:first-child,
    .list-scroll > .list-total > span:first-child {
        position: sticky; left: 0; z-index: 2;
    }
    .list-scroll > .list-row > span:first-child { background: #fff; }
    .list-scroll > .list-total > span:first-child { background: #fafbfc; }
    /* 冻结列的盒子从容器内容区最左侧开始（盖住左侧内边距），文字位置保持原样 → 滚动时不跳位 */
    .list-scroll > .list-head > span:first-child { margin-left: -10px; padding-left: 18px; }
    .list-scroll > .list-row > span:first-child,
    .list-scroll > .list-total > span:first-child { margin-left: -12px; padding-left: 12px; }
    /* 补住 6px 列间距（避免其余列从冻结列下面透出）+ 右侧一道浅阴影 */
    .list-scroll > .list-head > span:first-child::after,
    .list-scroll > .list-row > span:first-child::after,
    .list-scroll > .list-total > span:first-child::after {
        content: ''; position: absolute; top: 0; bottom: 0; right: -6px; width: 6px;
        background: #fff; box-shadow: 3px 0 5px -3px rgba(22,26,46,.12);
    }
    .empty-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 24px; text-align: center; font-size: 14px; color: #b0b4bd; }
    .empty-title { margin-top: 14px; font-size: 14px; font-weight: 600; color: #5a6472; }
    .empty-sub { margin-top: 7px; font-size: 12px; color: #a0a4ad; }

    /* ================= 设备选择弹层：左「设备类型」→ 右「具体型号」 ================= */
    .picker-mask {
        position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 80;
        display: none; align-items: flex-end; justify-content: center;
    }
    .picker-mask.show { display: flex; }
    .picker-sheet {
        width: 100%; max-width: 480px; background: #fff;
        /* 固定高度 56vh：切换设备类型时弹层不跳动（内部两栏各自滚动） */
        height: 56vh;
        border-radius: 20px 20px 0 0; display: flex; flex-direction: column; overflow: hidden;
        box-shadow: 0 -6px 24px rgba(22,26,46,.14);
        padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .picker-head {
        position: relative; display: flex; align-items: center;
        /* 上下内边距对称：✕ 绝对定位后与标题在同一水平线；标题左右各留 24px 才是真居中 */
        padding: 16px; border-bottom: 1px solid #f2f3f6;
    }
    /* 顶部拖拽条（手机端弹层的常规暗示） */
    .picker-head::before {
        content: ''; position: absolute; left: 50%; top: 8px; transform: translateX(-50%);
        width: 36px; height: 4px; border-radius: 2px; background: #e5e7ec;
    }
    /* 标题居中：占满整宽居中；✕ 绝对定位贴右（与标题左右对称，视觉居中） */
    .picker-title {
        flex: 1; min-width: 0; padding: 0 24px;
        text-align: center; font-size: 15px; font-weight: 700; color: #161a2e;
    }
    .picker-close {
        position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
        width: 24px; height: 24px; border-radius: 50%; color: #b0b4bd; font-size: 15px; line-height: 1;
        display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
    }
    .picker-close:hover { background: #f2f3f5; color: #666; }
    .picker-cols { flex: 1; display: flex; min-height: 0; }
    .picker-col { overflow-y: auto; -webkit-overflow-scrolling: touch; }
    /* 左栏：设备类型 */
    .picker-col.types { width: 36%; flex-shrink: 0; background: #f7f8fa; padding-bottom: 10px; }
    .picker-type {
        padding: 14px 10px 14px 14px; font-size: 14px; color: #5a6472; cursor: pointer;
        position: relative; overflow-wrap: anywhere; line-height: 1.45;
    }
    .picker-type .pt-count { font-size: 11px; color: #b0b4bd; }
    .picker-type.active { background: #fff; color: #E60012; font-weight: 600; }
    .picker-type.active::before {
        content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
        width: 3px; height: 16px; border-radius: 0 3px 3px 0; background: #E60012;
    }
    /* 右栏：具体设备型号 */
    .picker-col.models { flex: 1; min-width: 0; padding: 2px 0 6px; }
    .picker-model {
        display: flex; align-items: center; gap: 8px; padding: 13px 14px; cursor: pointer;
        border-bottom: 1px solid #f6f7f9;
    }
    .picker-model:last-child { border-bottom: none; }
    .picker-model:hover { background: #fafbfc; }
    .picker-model .pm-main { flex: 1; min-width: 0; }
    .picker-model .pm-name {
        font-size: 13.5px; font-weight: 600; color: #161a2e; overflow-wrap: anywhere;
    }
    /* 副行：设备型号（同型号多台时靠上方的客户自定义编号区分） */
    /* 副行（设备编号 / 型号）：字号调大 + 字距拉开，读起来更长更清楚 */
    .picker-model .pm-sub {
        margin-top: 3px; font-size: 12.5px; font-weight: 400; letter-spacing: 0; color: #8b90a0;
    }
    .picker-model .pm-check { flex-shrink: 0; color: #E60012; display: none; }
    .picker-model.active .pm-name { color: #E60012; }
    .picker-model.active .pm-check { display: flex; }
    .picker-empty { padding: 40px 16px; text-align: center; font-size: 12px; color: #b0b4bd; }

    /* ================= 日期选择：滚轮（年 / 月 / 周期区间） ================= */
    .date-sheet { height: auto; }                      /* 高度由内容决定（滚轮固定高，不跳动） */
    .date-sheet .picker-title { font-weight: 600; }
    .wheel-wrap { position: relative; height: 220px; display: flex; flex-shrink: 0; }
    /* 中间选中行的上下分隔线 */
    .wheel-lines {
        position: absolute; left: 0; right: 0; top: 88px; height: 44px;
        border-top: 1px solid #ebedf0; border-bottom: 1px solid #ebedf0; pointer-events: none;
    }
    /* 上下淡出遮罩，模拟滚轮景深 */
    .wheel-wrap::before, .wheel-wrap::after {
        content: ''; position: absolute; left: 0; right: 0; height: 74px; pointer-events: none; z-index: 2;
    }
    .wheel-wrap::before { top: 0; background: linear-gradient(#fff, rgba(255,255,255,0)); }
    .wheel-wrap::after { bottom: 0; background: linear-gradient(rgba(255,255,255,0), #fff); }
    .wheel-col {
        flex: 1; min-width: 0; height: 100%; overflow-y: scroll; scroll-snap-type: y mandatory;
        padding: 88px 0; text-align: center; scrollbar-width: none; -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
    }
    .wheel-col::-webkit-scrollbar { display: none; }
    .wheel-item {
        height: 44px; line-height: 44px; scroll-snap-align: center;
        font-size: 17px; color: #c3c7cf; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        transition: color .15s, font-weight .15s;
    }
    .wheel-item.active { color: #161a2e; font-weight: 600; }
    .wheel-item.range { font-size: 15px; }             /* 周区间文案稍小，避免挤压 */
    /* 底部按钮：取消（窄） + 确认（宽） */
    .dlg-btns {
        display: flex; gap: 10px; padding: 12px 16px;
        padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
        border-top: 1px solid #f2f3f6; flex-shrink: 0;
    }
    .dlg-btn { font-family: inherit; font-size: 15px; border-radius: 8px; padding: 12px 0; cursor: pointer; }
    .dlg-btn.ghost { flex: 0 0 34%; background: #fff; border: 1px solid #e3e5ea; color: #333; }
    .dlg-btn.ghost:hover { border-color: #cfd3da; }
    .dlg-btn.primary { flex: 1; background: #E60012; border: 1px solid #E60012; color: #fff; font-weight: 600; }
    .dlg-btn.primary:hover { background: #c40011; border-color: #c40011; }
    /* ================= 图表卡片：图表 ⇄ 明细 开关 + xlsx 观感明细表 =================
       与 PC 端口径一致：同一份数据既可画图、也可出 xlsx 观感的明细表。
       复用 .list-* 的横向拖动与首列冻结，只把表头换成品牌红渐变 + 白字，数字右对齐 + 等宽数字 */
    .view-toggle { margin-left: auto; display: inline-flex; gap: 4px; flex-shrink: 0; }
    .view-tab {
        font-family: inherit; font-size: 11px; line-height: 1; padding: 5px 9px; border-radius: 999px;
        background: #f2f4f7; color: #5a6472; border: none; cursor: pointer; white-space: nowrap;
    }
    .view-tab.active { background: #161a2e; color: #fff; font-weight: 600; }
    /* 网格化：行列都贴边（取消原内边距与列间距），行多时表体内部滚动、表头钉住 */
    .xls .list-scroll { max-height: 520px; overflow-y: auto; }
    .xls .list-head {
        position: sticky; top: 0; z-index: 3;
        background: #f2f3f5; border-bottom: 1px solid #e1e5ea;
    }
    .xls .list-head, .xls .list-row, .xls .list-total { padding: 0; gap: 0; }
    .xls .list-head > span {
        background: transparent; color: #1f2329; font-weight: 600; border-radius: 0;
        padding: 11px 10px; cursor: pointer; gap: 4px;
        border-right: 1px solid #e6e9ee;
    }
    .xls .sort-ico { flex-shrink: 0; color: #c2c8d2; }
    .xls .sort-ico.on { color: #1f2329; }
    .xls .list-row {
        background: #fff; color: #1f2329; font-size: 13px;
        border-bottom: 1px solid #f0f2f5;
    }
    .xls .list-row > span { padding: 12px 10px; border-right: 1px solid #f6f7f9; }
    .xls .list-total { background: #fafbfc; border-top: 1px solid #e1e5ea; }
    .xls .list-total > span { padding: 12px 10px; }
    .xls .list-head > span:last-child,
    .xls .list-row > span:last-child,
    .xls .list-total > span:last-child { border-right: none; }
    /* 冻结首列：贴边、不发原来的 6px 补丁块，改用自身阴影做分隔 */
    .xls .list-scroll > .list-head > span:first-child,
    .xls .list-scroll > .list-row > span:first-child,
    .xls .list-scroll > .list-total > span:first-child {
        margin-left: 0; padding-left: 10px;
        box-shadow: 2px 0 6px -3px rgba(22,26,46,.16);
    }
    .xls .list-scroll > .list-head > span:first-child::after,
    .xls .list-scroll > .list-row > span:first-child::after,
    .xls .list-scroll > .list-total > span:first-child::after { display: none; }
    /* 表头首列要「钉左 + 钉顶」，必须不透明（否则正文会从底下透出） */
    .xls .list-head > span:first-child { background: #f2f3f5; }
    .xls .list-head > .num, .xls .list-row .num, .xls .list-total .num {
        text-align: right; font-variant-numeric: tabular-nums;
    }
    .xls .list-head > .num { justify-content: flex-end; }
    /* 分页条：左＝当前区间/总数，右＝页码按钮（当前页深色实心，两端箭头到边界置灰） */
    .xls-pager {
        display: flex; align-items: center; justify-content: space-between; gap: 10px;
        padding: 10px 12px; background: #fff; border-top: 1px solid #f0f2f5;
    }
    .xls-range { font-size: 12px; color: #6b7280; font-variant-numeric: tabular-nums; }
    .xls-pages { display: inline-flex; align-items: center; gap: 6px; }
    .pg-btn {
        min-width: 28px; height: 28px; padding: 0 6px; border-radius: 7px;
        font-family: inherit; font-size: 12px; line-height: 1; cursor: pointer;
        background: #fff; color: #4b5563; border: 1px solid #e3e6ea; font-variant-numeric: tabular-nums;
    }
    .pg-btn:hover:not(:disabled):not(.on) { border-color: #c9ced8; }
    .pg-btn.on { background: #161a2e; border-color: #161a2e; color: #fff; font-weight: 600; }
    .pg-btn:disabled { color: #c2c8d2; cursor: default; }
    .pg-gap { padding: 0 2px; font-size: 12px; color: #9aa3b2; }
.pick-target { display: flex; gap: 8px; padding: 0 16px 8px; }
    .pick-target .pt-btn {
        flex: 1; height: 32px; border-radius: 16px; font-family: inherit; font-size: 13px;
        color: #5a6472; background: #f4f5f7; border: 1px solid #eef0f3; cursor: pointer;
    }
    .pick-target .pt-btn.active { color: #fff; background: #E60012; border-color: #E60012; font-weight: 600; }
    /* 下载（获取报表）与分享同款按钮，紧跟在分享右侧 */
    .hdr-dl-btn {margin-left: 4px;}
    /* 获取报表弹层 */
    /* 获取报表：字段较多，弹层按比例加高（原 56vh → 82vh），内容区独立滚动 */
    #planSheet .picker-sheet {height: 82vh;}
    .plan-body {padding: 0 16px 8px; overflow: auto; flex: 1; min-height: 0;}
    /* 分区卡片 */
    .plan-sec {padding: 4px 0 12px; border-bottom: 1px solid #f2f3f6;}
    .plan-sec:last-child {border-bottom: none;}
    .sec-title {font-size: 12px; font-weight: 600; color: #161a2e; margin: 12px 0 2px; letter-spacing: .2px;}
    .sec-title i {color: #E60012; font-style: normal;}
    .plan-label {display: block; font-size: 12.5px; color: #5a6472; margin: 12px 0 6px;}
    .plan-label i {color: #E60012; font-style: normal;}
    .plan-input {width: 100%; height: 38px; border: 1px solid #e6e8ee; border-radius: 8px;
        padding: 0 10px; font-family: inherit; font-size: 13px; color: #161a2e; background: #fff;}
    .plan-input:focus {outline: none; border-color: #E60012;}
    .plan-seg {display: flex; gap: 6px;}
    .plan-seg button {flex: 1; height: 34px; font-family: inherit; font-size: 12.5px; border-radius: 8px;
        background: #f7f8fa; border: 1px solid #eef0f3; color: #5a6472; cursor: pointer;}
    .plan-seg button.on {background: #fdecee; border-color: #f5c6cb; color: #E60012; font-weight: 600;}
    .plan-mail {display: flex; align-items: center; justify-content: space-between;
        height: 38px; padding: 0 10px; border-radius: 8px; background: #f7f8fa;
        font-size: 13px; color: #333;}
    .plan-mail span {font-size: 11.5px; color: #a7abb8;}
    .plan-select {appearance: none; -webkit-appearance: none; background-image: none;}
    .plan-row2 {display: flex; gap: 8px;}
    .plan-row2 > * {flex: 1; min-width: 0;}
    .plan-add {flex: 0 0 64px; height: 38px; font-family: inherit; font-size: 12.5px; border-radius: 8px;
        background: #fdecee; border: 1px solid #f5c6cb; color: #E60012; font-weight: 600; cursor: pointer;}

<script>
/* ========================================================================
 * 统一模板（一份配置 → 手机端适配器渲染）
 * ====================================================================== */
const TEMPLATE = {
    id: 'tpl_device_report',
    name: '设备报表 · 统一模板',
    machineType: '挖掘机',
    sourceDoc: '用户需求/日周月报表字段聚合表.md §2.1',
    blocks: ['kpi', 'runtime_segments', 'fuel', 'list']   /* 块顺序：指标卡 → 工时统计 → 能耗分析 → 周期明细 */
};

/* ==================== 首屏骨架屏（按后台配置生成） ====================
   组件是后台配置的、图形不固定 → 骨架不写死形状，按 block 名称映射：
     kpi / 指标         → 指标条（大数字 + 小标签）
     list / table / 明细 → 表格（5 列 × 3 行灰格）
     其余（折线 / 柱状 / 环形 / 文本 / 任意图表）→ 图形块
   配置取不到（真实接口未返回）时兜底给「图形 + 表格」两张通用卡 */
const SK_SHAPE_BY_KEY = [
    { re: /kpi|指标/i,              shape: 'kpi' },
    { re: /list|table|明细|表格/i,   shape: 'table' }
];

function skShapeOf(blockName) {
    const hit = SK_SHAPE_BY_KEY.filter(o => o.re.test(String(blockName || '')))[0];
    return hit ? hit.shape : 'plot';
}

function skCardHTML(shape) {
    const head = '<div class="sk-head"><span class="sk-block sk-ctitle"></span><span class="sk-block sk-cnote"></span></div>';
    if (shape === 'kpi') {
        return '<div class="sk-card sk-kpi">'
            + '<div class="sk-kpi-col"><span class="sk-block sk-v"></span><span class="sk-block sk-l"></span></div>'
            + '<div class="sk-kpi-col"><span class="sk-block sk-v"></span><span class="sk-block sk-l"></span></div>'
            + '</div>';
    }
    if (shape === 'table') {
        let cells = '';
        for (let i = 0; i < 15; i++) cells += '<span class="sk-block"></span>';
        return '<div class="sk-card">' + head + '<div class="sk-rows">' + cells + '</div></div>';
    }
    let bars = '';
    for (let i = 0; i < 7; i++) bars += '<i></i>';
    return '<div class="sk-card">' + head + '<div class="sk-bars">' + bars + '</div></div>';
}

function paintSkeleton(blocks) {
    const box = document.getElementById('skCards');
    if (!box) return;
    const list = blocks || (typeof TEMPLATE !== 'undefined' && TEMPLATE.blocks) || [];
    const shapes = list.length ? list.map(skShapeOf) : ['plot', 'table'];   /* 兜底：通用两卡 */
    box.innerHTML = shapes.map(skCardHTML).join('');
}

/* ==================== 字段定义（只保留当前报表真正用到的字段）
   完整字段聚合表见《三一设备报表项目PRDv2.0.md》；已停用的字段（日期 / 序列号 /
   B·C·D 单项 / 各占比 / G·H 单项等）2026-10-09 清理，需要时按 PRD 加回即可 ==================== */
/* avail: { day|week|month : 'show' | 'required' | 'noStat' | 'hidden' } */
const FIELDS = {
    /* 挖掘机 §2.1 */
    totalWork:   { label: '当日总工作时长 [A+B+C+D]', unit: '小时', type: 'derived', parts: ['A', 'B', 'C', 'D'], avail: { day: 'show', week: 'show', month: 'required' }, calc: '派生：A、B、C、D 分别累计后相加（日 / 周 口径 2026-10-09 放开）' },
    runTime:     { label: '总运行时长（B+C+D）', unit: '小时', type: 'derived', parts: ['B', 'C', 'D'], avail: { day: 'show', week: 'show', month: 'show' }, calc: '派生：B、C、D 分别累计后相加（日 / 周 口径 2026-10-09 放开）' },
    totalFuelGH: { label: '燃油或动力总消耗 [G+H]', unit: '升', type: 'derived', parts: ['G', 'H'], avail: { day: 'show', week: 'show', month: 'show' }, calc: '派生：G、H 分别累计后相加（日 / 周 口径 2026-10-09 放开）' },
    avgFuel:     { label: '平均燃油或动力消耗', unit: '升/小时', type: 'recalc', n: 'GH', d: 'ABCD', avail: { day: 'show', week: 'show', month: 'show' }, calc: '（G+H）÷（A+B+C+D）（日 / 周 口径 2026-10-09 放开）' }
};

/* 各周期的展示配置：明细列随周期变化（字段可用性见 FIELDS.avail） */
/* 明细表列头短文案（FIELDS 里的全称太长会折行，导致表头错位） */
/* 列头单位后缀（与页面统一的 L / h 写法） */
function colUnit(key) {
    const u = (FIELDS[key] || {}).unit;
    if (u === '升') return 'L';
    if (u === '小时') return 'h';
    if (u === '升/小时') return 'L/h';
    return '';
}

const LIST_LABEL = {
    idleFuelDaily: '怠速油耗',
    totalFuelDaily: '总油耗',
    idleA: '怠速时长',
    totalWork: '总工时',
    runTime: '运行时长',
    totalFuelGH: '总油耗',
    avgFuel: '平均油耗'
};

const DETAIL_COLS = ['totalWork', 'runTime', 'totalFuelGH', 'avgFuel'];   /* 周期明细统一表头（日 / 周 / 月 一致） */
const PERIOD_VIEW = {
    day:   { name: '日报', listCols: DETAIL_COLS },
    week:  { name: '周报', listCols: DETAIL_COLS },
    month: { name: '月报', listCols: DETAIL_COLS }
};

/* ==================== 模拟数据（按天生成，30 天） ==================== */
/* 设备类型图标（线性风格，与页面其它图标一致；圆形底由 .dev-avatar 提供） */
const DEV_ICON = {
    '挖掘机': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'
        + '<rect x="3" y="17.5" width="12" height="3.6" rx="1.8"/>'
        + '<rect x="5" y="12.6" width="7.4" height="4.4" rx="1"/>'

/* 圆形设备头像（type 缺省时按挖掘机兜底）—— 仅用于页面顶部标题前 */

/* 设备类型 → 具体设备型号（单机报表：先选类型，再选型号） */
