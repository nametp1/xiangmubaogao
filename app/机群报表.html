<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>机群报表</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
        font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
        background: #f4f5f7; color: #1a1a1a; min-height: 100vh; display: flex; align-items: stretch;
    }
    .phone { flex: 1 1 auto; min-width: 0; min-height: 100vh; background: #f4f5f7; display: flex; flex-direction: column; }

    /* ================= 顶部导航（三页统一：返回 + 页面标题＝当前 tab；三个 tab 可相互点击切换） ================= */
    .topbar {
        height: 52px; background: #fff; border-bottom: 1px solid #e8e8e8; flex-shrink: 0;
        display: flex; align-items: center; gap: 6px; padding: 0 12px;
    }
    .topbar-back {
        width: 30px; height: 30px; flex-shrink: 0; border: none; background: transparent;
        border-radius: 50%; color: #1a1a1a; font-size: 22px; line-height: 1; font-family: inherit;
        display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .topbar-back:hover { background: #f2f3f5; }
    /* 多语言：标题过长时省略号截断，不挤压右侧「提需求」入口 */
    .page-title {
        flex: 1 1 auto; min-width: 0; font-size: 17px; font-weight: 600; color: #161a2e;
        letter-spacing: .2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    /* 页面表头：返回与标题统一在 .topbar，这里只放本页的搜索与申请入口 */
    .app-header { background: #fff; padding: 12px 14px; flex-shrink: 0; border-bottom: 1px solid #eef0f3; }
    /* 顶部右上角：报表需求征集快速入口（多语言文案过长时省略号截断，不挤压 Tab） */
    .quick-more {
        margin-left: auto; flex-shrink: 0; font-family: inherit; white-space: nowrap;
        max-width: 42%; overflow: hidden; text-overflow: ellipsis;
        background: #fdecee; color: #E60012; border: 1px solid #f8d5d9; border-radius: 14px;
        font-size: 12px; font-weight: 600; padding: 4px 10px; cursor: pointer;
        transition: background .16s, border-color .16s, transform .1s;
    }
    .quick-more:hover { background: #fbdde1; border-color: #f2bcc2; }
    .quick-more:active { transform: scale(.97); }
    /* 表头一行：过滤胶囊（左，不压缩）+ 搜索框（右，占满剩余宽度） */
    .header-row { display: flex; align-items: center; gap: 8px; }
    .search-wrap { position: relative; flex: 1 1 auto; min-width: 120px; }
    .search-input {
        width: 100%; height: 36px; border: none; border-radius: 18px; background: #f4f5f7;
        padding: 0 14px 0 34px; font-size: 13px; font-family: inherit; color: #1a1a1a; outline: none;
    }
    .search-input::placeholder { color: #b0b4bd; }
    .search-icon {
        position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
        color: #b0b4bd; display: flex; pointer-events: none;
    }
    /* 口径过滤：仅看单机 / 仅看机群（与搜索框同行、放其前面；再点一次取消回到全部）
       多语言下文案变长时自身省略号，绝不把搜索框挤出去 */
    .filter-row { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
    .filter-chip {
        border: 1px solid #e3e5ea; background: #fff; color: #5a6472; font-family: inherit;
        font-size: 12px; line-height: 1; padding: 11px 12px; border-radius: 999px; cursor: pointer;
        transition: background .15s, border-color .15s, color .15s;
        flex: 0 0 auto; max-width: 96px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .filter-chip:hover { border-color: #f3b8be; color: #E60012; }
    .filter-chip.active { background: #fdecee; border-color: #f6c3c8; color: #E60012; font-weight: 600; }

    /* 引导文案（可点，与机群数据页一致）：没找到合适的报表时怎么申请，居中显示 */
    .view-hint {
        position: relative; flex-shrink: 0; background: #fffaf0; color: #ad6800; font-size: 12px; line-height: 1.6;
        padding: 9px 34px; border-bottom: 1px solid #f5ecd8;
        text-align: center; cursor: pointer; overflow-wrap: anywhere;
    }
    .view-hint:hover { background: #fff5e0; }
    .view-hint b { color: #E60012; font-weight: 600; }
    /* 右侧「×」：只关闭横幅，不触发「去申请」跳转（stopPropagation） */
    .view-hint .hint-close {
        position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
        width: 20px; height: 20px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 14px; line-height: 1; color: #c49a5b;
    }
    .view-hint .hint-close:hover { background: #f4e4c6; color: #ad6800; }
    .view-hint.hidden { display: none; }

    /* ================= 内容区 ================= */
    /* 顶部 tabs（与「报表订阅」页一致） */
    .top-tabs {
        flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 20px; margin-left: 6px;
        overflow-x: auto; scrollbar-width: none;
        -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain;
    }
    .top-tabs::-webkit-scrollbar { display: none; }
    .top-tab {
        position: relative; flex-shrink: 0; border: none; background: transparent; font-family: inherit; cursor: pointer;
        height: 52px; padding: 0; font-size: 15px; color: #8b90a0; white-space: nowrap;
    }
    .top-tab:hover:not(.active) { color: #E60012; }
    .top-tab.active { font-size: 17px; font-weight: 600; color: #161a2e; letter-spacing: .2px; cursor: default; }
    .top-tab.active::after {
        content: ''; position: absolute; left: 50%; transform: translateX(-50%); bottom: 8px;
        width: 20px; height: 2px; border-radius: 2px; background: #E60012;
    }

    .cat-group { margin-bottom: 6px; }
    .cat-title {
        display: flex; align-items: center; gap: 6px;
        font-size: 13px; font-weight: 600; color: #161a2e;
        margin: 10px 2px 8px;
    }
    .cat-title span { font-size: 11.5px; font-weight: 400; color: #a7abb8; }
    .cat-title::before {
        content: ''; width: 3px; height: 12px; border-radius: 2px; background: #E60012;
    }

    .screen { flex: 1; overflow-y: auto; padding: 12px 14px 28px; }

    /* 报表卡片：白底 + 细边 + 品牌红图标块，hover 浮起，点击进数据页 */
    .card {
        background: #fff; border-radius: 14px; padding: 14px 14px; margin-bottom: 10px;
        border: 1px solid #edeff3; box-shadow: 0 1px 2px rgba(22,26,46,.04);
    }
    /* 窄机：胶囊文案与内边距再收一点，优先保证搜索框可读 */
    @media (max-width: 360px) {
        .filter-chip { font-size: 11px; padding: 11px 9px; max-width: 84px; }
        .search-input { padding-left: 30px; }
    }

    .report-card {
        display: flex; align-items: flex-start; gap: 12px; cursor: pointer;
        transition: box-shadow .18s, transform .12s, border-color .18s;
    }
    .report-card:hover { border-color: #e2e6ee; box-shadow: 0 6px 18px rgba(22,26,46,.09); }
    .report-card:active { transform: scale(.99); }
    .rc-icon {
        width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0; margin-top: 2px;
        background: #fdecee; color: #E60012; display: flex; align-items: center; justify-content: center;
    }
    .rc-body { flex: 1; min-width: 0; }
    /* 多语言：报表名最多 2 行（英文 / 德文长单词强制断行，不撑破卡片） */
    .rc-name {
        font-size: 15.5px; font-weight: 600; color: #161a2e; line-height: 1.4;
        display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical;
        overflow: hidden; overflow-wrap: anywhere; word-break: break-word;
    }
    /* 副标题描述：字号小一号（11px），最多 2 行，超出以省略号结束 */
    .rc-desc {
        font-size: 11px; color: #8b90a0; line-height: 1.55; margin-top: 4px;
        display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical;
        overflow: hidden; text-overflow: ellipsis;
        overflow-wrap: anywhere; word-break: break-word;
    }
    .rc-go { flex-shrink: 0; align-self: center; color: #ccd0d8; display: flex; align-items: center; }
    .empty-wrap { padding: 80px 24px; text-align: center; font-size: 13px; color: #b0b4bd; }

</style>
</head>

const searchInput = document.getElementById('searchInput');
const screenEl = document.getElementById('screen');

/* 口径过滤：null = 全部；'单机' / '机群' = 只看该口径（两个选项互斥，再点一次取消）
   2026-10-09 用户要求：默认进来就只看单机 */
let scopeFilter = '单机';

/* 同步两个过滤胶囊的选中态 */
function syncScopeChips() {
    const map = { '单机': 'fcSingle', '机群': 'fcFleet' };
    Object.keys(map).forEach(function (k) {
        const btn = document.getElementById(map[k]);
        if (btn) btn.className = 'filter-chip' + (scopeFilter === k ? ' active' : '');
    });
}

function rep2match(r, kw) {
    return r.metrics.some(function (m) { return m.toLowerCase().indexOf(kw) >= 0; });
}

/* ==================== 渲染：报表清单（平铺，无分类） ==================== */
function renderCard(rep) {
    return `
        <div class="card report-card" onclick="openReport('${rep.name}','${rep.scope}')">
            <div class="rc-icon">${ICONS[rep.icon] || ICONS.summary}</div>
            <div class="rc-body">
                <div class="rc-name">${rep.name}</div>
                <div class="rc-desc">${rep.desc}</div>
            </div>
            <div class="rc-go"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></div>
        </div>`;
}

/* 切换「仅看单机 / 仅看机群」：选中新口径即替换，重复点同一个则取消回到全部 */
function toggleScope(scope) {
    scopeFilter = (scopeFilter === scope) ? null : scope;
    syncScopeChips();
    renderAll();
}

        if (raw) {
            const list = JSON.parse(raw)
                .filter(c => c.enabled !== 0 && (c.names || {})['zh-CN'])
                .sort((a, b) => (a.sort || 99) - (b.sort || 99))
                .map(c => c.names['zh-CN']);
            if (list.length) return list;
        }
    } catch (e) {}
    return DEFAULT_CATS.map(c => c.names['zh-CN']);
}

function renderAll() {
    const kw = searchInput.value.trim().toLowerCase();
    const list = reports.filter(function (r) {
        /* 开发中报表（metrics 为空 = 数据源未接入）整张不显示（2026-10-08 用户要求） */
        if (!r.metrics.length) return false;
        /* 口径过滤：仅看单机 / 仅看机群 */
        if (scopeFilter && r.scope !== scopeFilter) return false;
        return !kw
            || r.name.toLowerCase().indexOf(kw) >= 0
            || r.en.toLowerCase().indexOf(kw) >= 0
            || r.desc.toLowerCase().indexOf(kw) >= 0
            || rep2match(r, kw);
    });

    if (!list.length) {
        screenEl.innerHTML = '<div class="empty-wrap">'
            + (kw ? '未找到匹配的报表' : '当前筛选下没有报表') + '</div>';
        return;
    }

    /* 按后台「报表分类设置」的分类顺序与名称分组展示 */
    const catOrder = loadRepCats();
    const buckets = {};
    list.forEach(function (r) {
        const key = r.nature || '其他';
        (buckets[key] = buckets[key] || []).push(r);
    });
    const orderedCats = catOrder.filter(function (c) { return buckets[c]; });
    Object.keys(buckets).forEach(function (k) {
        if (orderedCats.indexOf(k) < 0) orderedCats.push(k);
    });

    screenEl.innerHTML = orderedCats.map(function (cat) {
        const items = buckets[cat] || [];
        if (!items.length) return '';
        return '<div class="cat-group">'
            + '<div class="cat-title">' + cat + '</div>'
            + items.map(renderCard).join('')
            + '</div>';
    }).join('');
}

/* ==================== 交互 ==================== */
/* 2026-10-08（方案 A）：去掉卡片上的「预览 / 添加」按钮，点击卡片直接进入数据页 */
/* 点卡片 = 访问这张报表：按卡片口径分流，报表名带过去，落地页顶栏标题就显示它
   —— 单机卡片 → 机群数据-单机.html；机群卡片（切到「仅看机群」看到的那些）→ 机群数据-机群.html
   （2026-10-15 用户要求：两侧数据各自落到对应数据页，不再统一进单机页） */
function openReport(name, scope) {
    const page = (scope === '机群') ? '机群数据-机群.html' : '机群数据-单机.html';
    location.href = page + (name ? '?report=' + encodeURIComponent(name) : '');
}

/* 返回上一页（无历史记录时只提示一下） */
function goBack() {
    if (history.length > 1) { history.back(); return; }
    showToast('返回上一页');
}

function showToast(msg) {
    const t = document.createElement('div');
    t.textContent = msg;
    t.style.cssText = 'position:fixed;left:50%;bottom:60px;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;'
        + 'font-size:12px;padding:9px 16px;border-radius:18px;z-index:99;max-width:80%;text-align:center;';
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 1800);
}

/* ==================== 初始化 ==================== */
syncScopeChips();   /* 默认选中「仅看单机」 */
renderAll();
</script>
