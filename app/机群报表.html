<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App · 机群报表（v2.0）</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
        font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
        background: #e9ebee; color: #1a1a1a; padding: 24px;
        display: flex; align-items: flex-start; justify-content: center; gap: 24px; flex-wrap: wrap;
    }

    /* ==================== App 页面（390px，1:1 还原截图） ==================== */
    .app-page {
        width: 390px; height: 844px; background: #f2f3f5; position: relative;
        overflow: hidden; display: flex; flex-direction: column; flex: 0 0 auto;
        box-shadow: 0 10px 40px rgba(0,0,0,.16);
    }

    /* ---- 顶部深色头 ---- */
    .app-header { background: #171a2b; padding: 22px 16px 18px; flex-shrink: 0; }
    .hd-row { display: flex; align-items: center; gap: 10px; height: 30px; }
    .hd-back { color: #fff; font-size: 26px; line-height: 1; cursor: pointer; margin-top: -3px; }
    .hd-title { color: #fff; font-size: 18px; font-weight: 600; letter-spacing: .3px; }
    .machine-row {
        margin-top: 16px; height: 26px; display: flex; align-items: center;
        justify-content: center; gap: 7px; color: #fff; font-size: 15px; cursor: pointer;
    }
    .machine-row .caret {
        width: 11px; height: 11px; margin-top: 2px;
        border-right: 2px solid #fff; border-bottom: 2px solid #fff;
        transform: rotate(45deg); border-radius: 1px; opacity: .95;
    }

    /* ---- 日报 / 周报 / 月报 ---- */
    .period-tabs {
        margin: 18px 18px 0; height: 40px; background: #fff; border-radius: 11px;
        padding: 4px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; flex-shrink: 0;
    }
    .period-tab {
        border: none; background: transparent; border-radius: 8px; font-family: inherit;
        font-size: 14px; color: #6b6b6b; cursor: pointer; transition: all .18s;
    }
    .period-tab.active {
        background: #fff; color: #111; font-weight: 600;
        box-shadow: 0 1px 4px rgba(0,0,0,.12);
    }

    /* ---- 日期行 ---- */
    .date-row {
        display: flex; align-items: center; justify-content: space-between;
        padding: 14px 26px 12px; flex-shrink: 0;
    }
    .date-nav {
        border: none; background: transparent; font-size: 20px; color: #111;
        cursor: pointer; font-family: inherit; line-height: 1; padding: 4px;
    }
    .date-nav:disabled { color: #c8c8c8; cursor: not-allowed; }
    .date-main {
        display: flex; align-items: center; gap: 8px;
        font-size: 19px; font-weight: 700; letter-spacing: .2px; cursor: pointer;
    }
    .date-main .caret {
        width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent;
        border-top: 7px solid #1a1a1a;
    }

    /* ---- 内容区 ---- */
    .app-content { flex: 1; overflow-y: auto; padding: 0 18px 18px; }
    .app-content::-webkit-scrollbar { width: 0; }
    .card {
        background: #fff; border-radius: 14px; margin-bottom: 16px;
    }
    .card-title { font-size: 16px; font-weight: 600; color: #1a1a1a; letter-spacing: .2px; }

    /* KPI 卡（截图中为骨架态：左右两栏 + 竖向分隔） */
    .kpi-card { padding: 16px 18px; }
    .kpi-wrap { display: grid; grid-template-columns: 1fr 1px 1fr; align-items: center; }
    .kpi-divider { background: #f0f0f0; align-self: stretch; }
    .kpi-item { padding: 0 4px; }
    .kpi-item.right { padding-left: 16px; }
    .kpi-label { font-size: 12px; color: #8c8c8c; }
    .kpi-value { font-size: 22px; font-weight: 800; color: #E60012; margin-top: 6px; line-height: 1.1; }
    .kpi-value small { font-size: 12px; font-weight: 400; color: #999; margin-left: 3px; }
    .kpi-sub { font-size: 11px; color: #a6a6a6; margin-top: 6px; }

    /* 骨架块 */
    .sk { background: #ebedef; border-radius: 4px; animation: skPulse 1.6s ease-in-out infinite; }
    .sk.line { height: 12px; }
    .sk.pill { height: 12px; border-radius: 4px; }
    @keyframes skPulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }

    /* 图表卡 */
    .chart-card { padding: 18px; position: relative; }
    .chart-area { position: relative; margin-top: 20px; height: 232px; }
    .chart-grid { display: flex; align-items: flex-end; justify-content: space-between; height: 200px; }
    .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
    .bar {
        width: 16px; border-radius: 3px 3px 0 0; background: #e9ebed;
        transition: height .45s ease;
    }
    .bar.empty { background: #eef0f2; }
    .bar-val { font-size: 11px; color: #666; margin-bottom: 6px; }
    .bar-val.hide { visibility: hidden; }
    .chart-axis { height: 1px; background: #e3e3e3; }
    .chart-labels { display: flex; justify-content: space-between; margin-top: 14px; }
    .x-label {
        flex: 1; text-align: center; font-size: 11px; color: #808080;
    }
    .x-label.hide { visibility: hidden; }
    .sk-x {
        height: 12px; width: 46px; margin: 0 auto; background: #ebedef; border-radius: 4px;
        animation: skPulse 1.6s ease-in-out infinite;
    }

    /* 加载中胶囊 */
    .loading-pill {
        position: absolute; left: 50%; transform: translateX(-50%);
        display: flex; align-items: center; gap: 9px;
        background: rgba(41,41,41,.94); color: #fff; font-size: 14px;
        padding: 9px 20px; border-radius: 999px; white-space: nowrap;
        box-shadow: 0 4px 14px rgba(0,0,0,.18);
    }
    .spinner {
        width: 15px; height: 15px; border-radius: 50%;
        border: 2px solid rgba(255,255,255,.28); border-top-color: #fff;
        animation: spin .8s linear infinite; flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .pill-overlay { position: absolute; left: 0; right: 0; top: 196px; display: flex; justify-content: center; }

    /* ==================== 演示控制台（页面外，不影响 1:1） ==================== */
    .devpanel {
        width: 320px; background: #fff; border-radius: 12px; padding: 18px;
        box-shadow: 0 2px 12px rgba(0,0,0,.06); font-size: 13px; flex: 0 0 auto;
    }
    .devpanel h3 { font-size: 14px; margin-bottom: 6px; }
    .devpanel .sub { font-size: 12px; color: #999; line-height: 1.7; margin-bottom: 14px; }
    .devpanel .grp { margin-bottom: 14px; }
    .devpanel label { display: block; font-size: 12px; color: #666; margin-bottom: 6px; }
    .seg { display: inline-flex; padding: 3px; background: #f2f2f2; border-radius: 7px; }
    .seg button {
        border: none; background: transparent; padding: 6px 12px; border-radius: 5px;
        font-size: 12px; color: #666; cursor: pointer; font-family: inherit;
    }
    .seg button.active { background: #fff; color: #E60012; font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .devpanel .btn {
        height: 32px; padding: 0 14px; border: 1px solid #d9d9d9; background: #fff;
        border-radius: 5px; font-size: 12px; color: #333; cursor: pointer; font-family: inherit;
    }
    .devpanel .btn:hover { border-color: #E60012; color: #E60012; }
    .devpanel .note {
        margin-top: 14px; font-size: 11px; color: #888; line-height: 1.8;
        background: #fafafa; border-radius: 6px; padding: 10px;
    }
    .devpanel .note b { color: #555; }
</style>
</head>
<body>

<!-- ==================== App 页面 ==================== -->
<div class="app-page" id="appPage">

    <!-- 顶部深色头 -->
    <header class="app-header">
        <div class="hd-row">
            <span class="hd-back" onclick="toast('返回上一页')">‹</span>
            <span class="hd-title" id="pageTitle">挖掘机机群报表</span>
        </div>
        <div class="machine-row" onclick="cycleMachine()">
            <span id="machineName">挖掘机</span>
            <span class="caret"></span>
        </div>
    </header>

    <!-- 周期切换 -->
    <div class="period-tabs">
        <button class="period-tab active" data-period="day" onclick="switchPeriod('day')">日报</button>
        <button class="period-tab" data-period="week" onclick="switchPeriod('week')">周报</button>
        <button class="period-tab" data-period="month" onclick="switchPeriod('month')">月报</button>
    </div>

    <!-- 日期 -->
    <div class="date-row">
        <button class="date-nav" id="navPrev" onclick="shiftDate(-1)">‹</button>
        <span class="date-main" id="dateMain">2026/09/09<span class="caret"></span></span>
        <button class="date-nav" id="navNext" onclick="shiftDate(1)">›</button>
    </div>

    <!-- 内容 -->
    <div class="app-content" id="content">
        <!-- KPI 卡 -->
        <div class="card kpi-card">
            <div class="kpi-wrap" id="kpiWrap"></div>
        </div>

        <!-- 图表一 -->
        <div class="card chart-card">
            <div class="card-title" id="chartTitle1">日开工统计</div>
            <div class="chart-area" id="chartArea1">
                <div class="chart-grid" id="bars1"></div>
                <div class="chart-axis"></div>
                <div class="chart-labels" id="labels1"></div>
            </div>
            <div class="pill-overlay" id="pillOverlay" style="display:none;">
                <div class="loading-pill"><span class="spinner"></span>加载中...</div>
            </div>
        </div>

        <!-- 图表二 -->
        <div class="card chart-card">
            <div class="card-title" id="chartTitle2">日总工时统计</div>
            <div class="chart-area" id="chartArea2">
                <div class="chart-grid" id="bars2"></div>
                <div class="chart-axis"></div>
                <div class="chart-labels" id="labels2"></div>
            </div>
        </div>
    </div>
</div>

<!-- ==================== 演示控制台 ==================== -->
<aside class="devpanel">
    <h3>演示控制台</h3>
    <div class="sub">左侧页面为截图 1:1 还原（默认处于「加载中」态）。切换到「加载完成」可查看捏造的数据。</div>

    <div class="grp">
        <label>页面状态</label>
        <div class="seg" id="stateSeg">
            <button class="active" data-state="loading" onclick="setState('loading')">加载中（截图态）</button>
            <button data-state="loaded" onclick="setState('loaded')">加载完成</button>
        </div>
    </div>

    <div class="grp">
        <label>机型（点击页面上的机型也可切换）</label>
        <div class="seg" id="machineSeg">
            <button class="active" data-machine="挖掘机" onclick="setMachine('挖掘机')">挖掘机</button>
            <button data-machine="宽体车" onclick="setMachine('宽体车')">宽体车</button>
            <button data-machine="轮式装载机" onclick="setMachine('轮式装载机')">轮式装载机</button>
        </div>
    </div>

    <div class="grp">
        <label>周期</label>
        <div class="seg" id="periodSeg">
            <button class="active" data-period="day" onclick="switchPeriod('day')">日报</button>
            <button data-period="week" onclick="switchPeriod('week')">周报</button>
            <button data-period="month" onclick="switchPeriod('month')">月报</button>
        </div>
    </div>

    <div class="grp">
        <button class="btn" onclick="replayLoading()">重播加载动画</button>
    </div>

    <div class="note" id="devNote"></div>
</aside>

<script>
/* ========================================================================
 * 数据（捏造）：7 台挖掘机 · 2026/09/09 前后各 7 天
 *   日开工统计  = 当日开工时长（小时），开工判定：当日在线 ≥ 30 分钟
 *   日总工时统计 = 当日总工时（小时）= 开工时长 + 怠速时长
 * ====================================================================== */
const MACHINES = [
    { id: 'EX003', model: 'SY215C10' },
    { id: 'EX007', model: 'SY365H'   },
    { id: 'EX012', model: 'SY485H'   },
    { id: 'EX018', model: 'SY215C10' },
    { id: 'EX021', model: 'SY305H'   },
    { id: 'EX026', model: 'SY135C10' },
    { id: 'EX031', model: 'SY550H'   }
];

/* 以 2026/09/09 为「今天」的日开工时长序列（7 台设备） */
const DAILY = {
    '2026/09/03': [7.8, 6.9, 5.6, 5.0, 3.9, 2.8, 0],
    '2026/09/04': [8.0, 7.1, 5.9, 5.1, 4.0, 3.0, 0],
    '2026/09/05': [6.4, 5.8, 4.9, 4.2, 3.2, 2.1, 0],
    '2026/09/06': [3.2, 2.9, 2.4, 2.1, 1.6, 1.0, 0],
    '2026/09/07': [8.4, 7.6, 6.3, 5.5, 4.3, 3.2, 1.4],
    '2026/09/08': [8.6, 7.8, 6.5, 5.7, 4.5, 3.3, 1.6],
    '2026/09/09': [8.2, 7.4, 6.1, 5.3, 4.2, 3.1, 0],
    '2026/09/10': [8.1, 7.2, 6.0, 5.2, 4.1, 3.0, 1.2],
    '2026/09/11': [8.3, 7.5, 6.2, 5.4, 4.2, 3.1, 1.3],
    '2026/09/12': [7.9, 7.0, 5.8, 5.0, 3.9, 2.9, 1.1],
    '2026/09/13': [0, 0, 0, 0, 0, 0, 0],
    '2026/09/14': [8.5, 7.7, 6.4, 5.6, 4.4, 3.2, 1.5],
    '2026/09/15': [8.2, 7.3, 6.1, 5.3, 4.2, 3.1, 1.4]
};

/* 怠速时长（小时）：日总工时 = 开工时长 + 怠速 */
const IDLE = [1.4, 1.1, 0.9, 0.8, 0.6, 0.5, 0.3];

/* 机型 → 设备与系数（捏造） */
const MACHINE_SETS = {
    '挖掘机':     { devices: MACHINES,            factor: 1.0 },
    '宽体车':     { devices: [
                        { id: 'WT011', model: 'STC1000' },
                        { id: 'WT014', model: 'STC1000' },
                        { id: 'WT019', model: 'STC800' },
                        { id: 'WT023', model: 'STC800' },
                        { id: 'WT027', model: 'STC1000' },
                        { id: 'WT031', model: 'STC800' }
                    ], factor: 1.18 },
    '轮式装载机': { devices: [
                        { id: 'LD001', model: 'SW405K' },
                        { id: 'LD002', model: 'SW955K' },
                        { id: 'LD004', model: 'SW955K' },
                        { id: 'LD007', model: 'SW405K' },
                        { id: 'LD009', model: 'SW955K' }
                    ], factor: 0.86 }
};

const WEEK_RANGE = ['2026/09/03', '2026/09/04', '2026/09/05', '2026/09/06', '2026/09/07', '2026/09/08', '2026/09/09'];
const MONTH_DAYS = ['2026/09/03','2026/09/04','2026/09/05','2026/09/06','2026/09/07','2026/09/08','2026/09/09','2026/09/10','2026/09/11','2026/09/12','2026/09/13','2026/09/14','2026/09/15'];

let state = {
    pageState: 'loading',      // loading | loaded
    period: 'day',
    machine: '挖掘机',
    dayIndex: 6                // DAILY 序列中以 09/09 为基准的索引
};

/* ==================== 取数（捏造） ==================== */
function currentSet() { return MACHINE_SETS[state.machine]; }

function dayKeysFor(period) {
    const keys = Object.keys(DAILY);
    const base = keys.indexOf('2026/09/09');
    if (period === 'day') return [keys[base + state.dayIndex - 6]];
    if (period === 'week') {
        const start = base + state.dayIndex - 6 - 6;   // 7 天窗口
        return keys.slice(Math.max(0, start), Math.max(0, start) + 7);
    }
    return keys.slice(0, keys.length);                 // 月：本期全部
}

function seriesFor(metric) {
    const set = currentSet();
    const n = set.devices.length;
    const keys = dayKeysFor(state.period);
    const out = [];
    for (let i = 0; i < n; i++) {
        let sum = 0;
        keys.forEach(k => {
            const arr = DAILY[k] || [];
            const v = arr[i % arr.length] || 0;
            sum += (metric === 'total' ? v + (v > 0 ? IDLE[i % IDLE.length] * 0.6 : 0) : v);
        });
        out.push(+(sum * set.factor).toFixed(1));
    }
    return out;
}

function summarize(metric) {
    const set = currentSet();
    const vals = seriesFor(metric);
    const total = set.devices.length;
    const working = vals.filter(v => v > 0).length;
    const sum = vals.reduce((a, b) => a + b, 0);
    return {
        vals: vals,
        working: working,
        total: total,
        rate: total ? (working / total * 100) : 0,
        sum: +sum.toFixed(1),
        avg: working ? +(sum / working).toFixed(1) : 0
    };
}

/* ==================== 日期文案 ==================== */
function dateText() {
    const keys = dayKeysFor(state.period);
    if (state.period === 'day') return keys[0];
    if (state.period === 'week') return keys[0] + ' – ' + keys[keys.length - 1];
    return '2026 年 9 月';
}

/* ==================== 渲染 ==================== */
const PERIOD_LABEL = { day: '日', week: '周', month: '月' };

function render() {
    const set = currentSet();
    const n = set.devices.length;

    document.getElementById('machineName').textContent = state.machine;
    document.getElementById('pageTitle').textContent = state.machine + '机群报表';
    document.querySelectorAll('.period-tab').forEach(t => t.classList.toggle('active', t.dataset.period === state.period));
    document.querySelectorAll('#periodSeg button').forEach(b => b.classList.toggle('active', b.dataset.period === state.period));
    document.querySelectorAll('#machineSeg button').forEach(b => b.classList.toggle('active', b.dataset.machine === state.machine));
    document.querySelectorAll('#stateSeg button').forEach(b => b.classList.toggle('active', b.dataset.state === state.pageState));

    document.getElementById('dateMain').innerHTML = dateText() + '<span class="caret"></span>';
    document.getElementById('dateMain').setAttribute('onclick', "toast('打开日期选择器')");
    document.getElementById('navNext').disabled = state.dayIndex >= 6 && state.period === 'day';

    const pl = PERIOD_LABEL[state.period];
    document.getElementById('chartTitle1').textContent = pl + '开工统计';
    document.getElementById('chartTitle2').textContent = pl + '总工时统计';

    const loading = state.pageState === 'loading';
    document.getElementById('pillOverlay').style.display = loading ? 'flex' : 'none';

    /* ---- KPI 卡 ---- */
    const kpi = document.getElementById('kpiWrap');
    if (loading) {
        kpi.innerHTML = `
            <div class="kpi-item">
                <div class="sk line" style="width:64%;"></div>
                <div class="sk pill" style="width:38%; margin-top:12px;"></div>
            </div>
            <div class="kpi-divider"></div>
            <div class="kpi-item right">
                <div class="sk line" style="width:52%;"></div>
                <div class="sk pill" style="width:30%; margin-top:12px;"></div>
            </div>`;
    } else {
        const work = summarize('work');
        const totalh = summarize('total');
        kpi.innerHTML = `
            <div class="kpi-item">
                <div class="kpi-label">${pl}开工设备</div>
                <div class="kpi-value">${work.working}<small>/ ${work.total} 台</small></div>
                <div class="kpi-sub">开工判定：当期在线 ≥ 30 分钟</div>
            </div>
            <div class="kpi-divider"></div>
            <div class="kpi-item right">
                <div class="kpi-label">${pl}平均开工率</div>
                <div class="kpi-value">${work.rate.toFixed(1)}<small>%</small></div>
                <div class="kpi-sub">${pl}总工时 ${totalh.sum} 小时</div>
            </div>`;
    }

    /* ---- 两个柱状图 ---- */
    drawChart('work', 'bars1', 'labels1', loading);
    drawChart('total', 'bars2', 'labels2', loading);

    renderDevNote();
}

function drawChart(metric, barsId, labelsId, loading) {
    const set = currentSet();
    const vals = seriesFor(metric);
    const max = Math.max.apply(null, vals.concat([1]));

    /* 骨架态：柱高统一（与截图一致，不暴露真实数值） */
    const SKELETON_HEIGHTS = [92, 96, 88, 90, 84, 80, 76, 74, 72, 70];

    const bars = document.getElementById(barsId);
    const labels = document.getElementById(labelsId);

    bars.innerHTML = vals.map((v, i) => {
        const h = loading
            ? SKELETON_HEIGHTS[i % SKELETON_HEIGHTS.length]
            : Math.max(6, Math.round(v / max * 176));
        const bg = (!loading && v > 0) ? 'background:linear-gradient(180deg,#ff3b47,#E60012);' : '';
        return `<div class="bar-col">
            <span class="bar-val ${loading ? 'hide' : ''}">${v > 0 ? v.toFixed(1) + 'h' : '未开工'}</span>
            <div class="bar ${v > 0 ? '' : 'empty'}" style="height:${h}px;${bg}"></div>
        </div>`;
    }).join('');

    labels.innerHTML = set.devices.map((d, i) => loading
        ? '<div class="x-label"><div class="sk-x"></div></div>'
        : `<div class="x-label">${d.id}</div>`).join('');
}

function renderDevNote() {
    const pl = PERIOD_LABEL[state.period];
    const set = currentSet();
    const work = summarize('work');
    const totalh = summarize('total');
    const keys = dayKeysFor(state.period);
    document.getElementById('devNote').innerHTML = state.pageState === 'loading'
        ? `<b>当前为截图态</b>：KPI 骨架 + 柱状骨架 + 居中「加载中...」胶囊（含 spinner 动效、骨架呼吸动效）。`
        : `<b>${state.machine} · ${pl}报</b>（${keys.length} 个统计日 / ${set.devices.length} 台设备）<br>
           ${pl}开工设备：${work.working}/${work.total} 台（${work.rate.toFixed(1)}%）<br>
           ${pl}开工时长合计：${work.sum} 小时，平均 ${work.avg} 小时/台<br>
           ${pl}总工时合计：${totalh.sum} 小时（含怠速）<br>
           <span style="color:#bbb;">数据为捏造，仅用于演示版式。</span>`;
}

/* ==================== 交互 ==================== */
function setState(s) { state.pageState = s; render(); }
function switchPeriod(p) { state.period = p; state.dayIndex = 6; render(); }
function setMachine(m) { state.machine = m; render(); }
function cycleMachine() {
    const list = Object.keys(MACHINE_SETS);
    setMachine(list[(list.indexOf(state.machine) + 1) % list.length]);
}
function shiftDate(delta) {
    const step = state.period === 'day' ? 1 : (state.period === 'week' ? 7 : 6);
    state.dayIndex = Math.min(6, Math.max(0, state.dayIndex + delta * step));
    render();
}
function replayLoading() {
    state.pageState = 'loading';
    render();
    const bars = document.querySelectorAll('#bars1 .bar, #bars2 .bar');
    bars.forEach((b, i) => {
        b.style.transition = 'none';
        b.style.height = '6px';
        setTimeout(() => {
            b.style.transition = 'height .45s ease';
            render();
        }, 60 + i * 20);
    });
}

function toast(msg) {
    const t = document.createElement('div');
    t.textContent = msg;
    t.style.cssText = 'position:fixed;left:50%;bottom:48px;transform:translateX(-50%);background:rgba(0,0,0,.78);'
        + 'color:#fff;font-size:12px;padding:9px 16px;border-radius:18px;z-index:99;';
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 1600);
}

/* ==================== 初始化 ==================== */
render();
</script>
</body>
</html>
