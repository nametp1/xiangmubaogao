<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手机端 · 报表订阅（v2.0）</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
        font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
        background: #f4f5f7; color: #1a1a1a; min-height: 100vh; display: flex; align-items: stretch;
    }
    .phone { flex: 1 1 auto; min-width: 0; min-height: 100vh; background: #f4f5f7; display: flex; flex-direction: column; }

    /* ================= 顶部导航（三页统一：返回 + 页面标题＝当前 tab；三个 tab 可相互点击切换） ================= */
    .topbar {
        height: 52px; background: #fff; border-bottom: 1px solid #e8e8e8; flex-shrink: 0;
        display: flex; align-items: center; padding: 0 12px;
    }
    .topbar-back {
        width: 30px; height: 30px; flex-shrink: 0; border: none; background: transparent;
        border-radius: 50%; color: #1a1a1a; font-size: 22px; line-height: 1; font-family: inherit;
        display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .topbar-back:hover { background: #f2f3f5; }
    /* 多语言下 Tab 文案会变长：Tab 条自己横向滚动、Tab 不被压缩，返回键与右侧入口固定不被挤走 */
    .top-tabs {
        flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 20px; margin-left: 6px;
        overflow-x: auto; scrollbar-width: none;
        -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain;
    }
    .top-tabs::-webkit-scrollbar { display: none; }
    .top-tab {
        position: relative; flex-shrink: 0; border: none; background: transparent; font-family: inherit; cursor: pointer;
        height: 52px; padding: 0; font-size: 15px; color: #8b90a0; white-space: nowrap;
    }
    .top-tab:hover:not(.active) { color: #E60012; }
    .top-tab.active { font-size: 17px; font-weight: 600; color: #161a2e; letter-spacing: .2px; cursor: default; }
    .top-tab.active::after {
        content: ''; position: absolute; left: 50%; transform: translateX(-50%); bottom: 8px;
        width: 20px; height: 2px; border-radius: 2px; background: #E60012;
    }
    /* 页面表头：返回与标题统一在 .topbar，这里只放本页的搜索与新建入口 */
    .app-header {
        background: #fff; padding: 12px 14px; flex-shrink: 0;
        border-bottom: 1px solid #eef0f3; display: flex; align-items: center; gap: 10px;
    }
    /* 顶部右上角：报表需求征集快速入口（多语言文案过长时省略号截断，不挤压 Tab） */
    .quick-more {
        margin-left: auto; flex-shrink: 0; font-family: inherit; white-space: nowrap;
        max-width: 42%; overflow: hidden; text-overflow: ellipsis;
        background: #fdecee; color: #E60012; border: 1px solid #f8d5d9; border-radius: 14px;
        font-size: 12px; font-weight: 600; padding: 4px 10px; cursor: pointer;
        transition: background .16s, border-color .16s, transform .1s;
    }
    .quick-more:hover { background: #fbdde1; border-color: #f2bcc2; }
    .quick-more:active { transform: scale(.97); }
    .search-wrap { position: relative; flex: 1; min-width: 0; }
    .search-input {
        width: 100%; height: 36px; border: none; border-radius: 18px; background: #f4f5f7;
        padding: 0 14px 0 34px; font-size: 13px; font-family: inherit; color: #1a1a1a; outline: none;
    }
    .search-input::placeholder { color: #b0b4bd; }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #b0b4bd; display: flex; pointer-events: none; }
    .add-btn {
        flex-shrink: 0; border: none; background: #E60012; color: #fff; font-family: inherit;
        font-size: 12px; padding: 9px 14px; border-radius: 18px; cursor: pointer; white-space: nowrap;
        box-shadow: 0 2px 8px rgba(230,0,18,.22);
    }
    .add-btn:hover { background: #c40011; }

    /* ================= 内容区 ================= */
    .screen { flex: 1; overflow-y: auto; padding: 12px 14px 28px; }
    .card {
        background: #fff; border-radius: 18px; padding: 16px 16px 12px; margin-bottom: 12px;
        box-shadow: 0 2px 8px rgba(22,26,46,.055), 0 1px 2px rgba(22,26,46,.04);
        border: 1px solid rgba(22,26,46,.04);
        transition: transform .14s, box-shadow .14s;
    }
    .card:active { transform: scale(.995); box-shadow: 0 1px 4px rgba(22,26,46,.07); }
    .card.is-expired { background: #fafbfc; box-shadow: none; border-color: #f0f1f4; }
    .rc-head { display: flex; align-items: flex-start; gap: 10px; }
    .rc-name { flex: 1; min-width: 0; font-size: 16px; font-weight: 650; color: #161a2e; line-height: 1.35; letter-spacing: .1px; }
    .card.is-expired .rc-name { color: #9aa0ad; }
    .badge {
        flex-shrink: 0; font-size: 10.5px; line-height: 1.5; border-radius: 999px;
        padding: 2px 9px; border: 1px solid transparent; font-weight: 500;
    }
    .badge.normal { background: #f0faf5; color: #389e0d; border-color: #b7eb8f; }
    .badge.overdue, .badge.partial { background: #fff7e6; color: #d46b08; border-color: #ffd591; }
    .badge.expired { background: #f5f5f5; color: #999; border-color: #d9d9d9; }
    .badge.overdue, .badge.partial, .badge.expired { cursor: help; }
    .rc-type { font-size: 12px; color: #6b7280; margin-top: 4px; }
    /* 通用弹层 */
    .mask { position: fixed; inset: 0; z-index: 90; display: none; background: rgba(0,0,0,.45); align-items: flex-end; justify-content: center; }
    .mask.show { display: flex; }
    .dlg {
        width: 100%; max-width: 480px; background: #fff; border-radius: 16px 16px 0 0;
        padding: 20px 18px calc(16px + env(safe-area-inset-bottom, 0px));
    }
    .dlg-title { font-size: 15px; font-weight: 600; color: #161a2e; text-align: center; }
    .dlg-text { margin: 10px 0 18px; font-size: 13px; color: #5a6472; line-height: 1.6; text-align: center; }
    .dlg-btns { display: flex; gap: 10px; padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px)); }
    .dlg-btn { flex: 1; height: 42px; border: none; border-radius: 21px; font-family: inherit; font-size: 14px; cursor: pointer; }
    .dlg-btn.ghost { background: #f4f5f7; color: #5a6472; }
    .dlg-btn.primary { background: #E60012; color: #fff; font-weight: 600; }
    .dlg-btn.danger { background: #E60012; color: #fff; font-weight: 600; }
    .edit-sheet { max-height: 88vh; display: flex; flex-direction: column; }
    .edit-body { flex: 1; min-height: 0; overflow: auto; padding: 0 16px; }
    .sec-title { font-size: 12px; font-weight: 600; color: #161a2e; margin: 14px 0 2px; }
    .req { color: #E60012; }
    .f-label { display: block; font-size: 12.5px; color: #5a6472; margin: 12px 0 6px; }
    .f-input {
        width: 100%; height: 38px; border: 1px solid #e6e8ee; border-radius: 8px; padding: 0 10px;
        font-family: inherit; font-size: 13px; color: #161a2e; background: #fff;
    }
    .f-row { display: flex; gap: 8px; }
    .f-row > * { flex: 1; min-width: 0; }
    .f-add { flex: 0 0 62px; height: 38px; border-radius: 8px; font-family: inherit; font-size: 12.5px;
        background: #fdecee; border: 1px solid #f5c6cb; color: #E60012; font-weight: 600; cursor: pointer; }
    .seg { display: flex; gap: 6px; }
    .seg button { flex: 1; height: 34px; font-family: inherit; font-size: 12.5px; border-radius: 8px;
        background: #f4f5f7; border: 1px solid transparent; color: #5a6472; cursor: pointer; }
    .seg button.on { background: #fdecee; border-color: #f5c6cb; color: #E60012; font-weight: 600; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 999px;
        background: #f2f3f5; font-size: 12px; color: #333; }
    .chip span { color: #8b90a0; cursor: pointer; font-size: 13px; line-height: 1; }

    .rc-actions { display: flex; align-items: center; gap: 12px; }
    .link.danger { color: #E60012; }

    .rc-meta {
        margin-top: 6px; font-size: 12px; color: #98a0ad; letter-spacing: .1px;
        display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .rc-meta .m-left {
        display: flex; align-items: center; gap: 6px; min-width: 0;
        overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    }
    .rc-meta .m-right { flex-shrink: 0; color: #c0c5cf; font-size: 11.5px; }
    .rc-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: #d5d9e0; flex-shrink: 0; }
    .rc-meta .m-chip {
        font-size: 11.5px; line-height: 1.6; color: #5a6472; background: #f4f5f7;
        border-radius: 6px; padding: 1px 7px; white-space: nowrap;
    }
    .rc-meta .m-chip.is-freq { color: #E60012; background: #fdecee; font-weight: 600; }
    .rc-meta .m-chip.is-time { color: #24839B; background: #eaf6f8; }
    .rc-foot {
        display: flex; align-items: center; gap: 10px; margin-top: 14px; padding-top: 12px;
        border-top: 1px solid #f3f4f7;
    }
    .rc-actions .link {
        font-size: 13px; color: #5a6472; padding: 4px 2px; border-radius: 6px;
    }
    .rc-actions .link:active { opacity: .6; }
    .switch { position: relative; width: 40px; height: 22px; flex-shrink: 0; }
    .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
    .switch .track { position: absolute; inset: 0; background: #e0e3e8; border-radius: 11px; transition: background .18s; }
    .switch .track::after {
        content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; background: #fff;
        border-radius: 50%; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .18s;
    }
    .switch input:checked + .track { background: #E60012; }
    .switch input:checked + .track::after { transform: translateX(18px); }
    .switch input:disabled + .track { opacity: .45; }
    .switch-label { font-size: 11px; color: #8b90a0; }
    .rc-actions { margin-left: auto; }
    .link { font-size: 12px; color: #8b90a0; cursor: pointer; }
    .link:hover { color: #E60012; }

    /* 引导文案（可点，与机群数据页一致）：没找到合适的报表时怎么申请，居中显示 */
    .view-hint {
        position: relative; flex-shrink: 0; background: #fffaf0; color: #ad6800; font-size: 12px; line-height: 1.6;
        padding: 9px 34px; border-bottom: 1px solid #f5ecd8;
        text-align: center; cursor: pointer;
    }
    .view-hint:hover { background: #fff5e0; }
    .view-hint b { color: #E60012; font-weight: 600; }
    /* 右侧「×」：只关闭横幅，不触发「去申请」跳转（stopPropagation） */
    .view-hint .hint-close {
        position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
        width: 20px; height: 20px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 14px; line-height: 1; color: #c49a5b;
    }
    .view-hint .hint-close:hover { background: #f4e4c6; color: #ad6800; }
    .view-hint.hidden { display: none; }

    .empty-wrap { padding: 54px 20px; text-align: center; }
    .empty-title { font-size: 14px; color: #8b90a0; }
    .empty-sub { font-size: 12px; color: #b0b4bd; margin-top: 7px; line-height: 1.6; }
    .empty-wrap .guide-btns { margin-top: 18px; }

    /* ================= 详情面板（底部弹出） ================= */
    .sheet-mask { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 60; display: none; align-items: flex-end; justify-content: center; }
    .sheet-mask.active { display: flex; }
    .sheet {
        width: 100%; max-width: 520px; max-height: 84vh; background: #fff;
        border-radius: 18px 18px 0 0; display: flex; flex-direction: column; overflow: hidden;
    }
    .sheet-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px 14px; border-bottom: 1px solid #f2f3f6; }
    .sheet-title { flex: 1; min-width: 0; font-size: 16px; font-weight: 700; color: #161a2e; line-height: 1.4; }
    .sheet-close { font-size: 16px; color: #b0b4bd; cursor: pointer; line-height: 1; }
    .sheet-body { padding: 2px 18px 16px; overflow-y: auto; }
    .sheet-sub { font-size: 12px; font-weight: 700; color: #161a2e; padding: 18px 0 4px; }
    .kv-row { display: flex; align-items: flex-start; gap: 12px; padding: 11px 0; border-bottom: 1px solid #f5f6f8; font-size: 12px; }
    .kv-row:last-child { border-bottom: none; }
    .kv-k { width: 78px; flex-shrink: 0; color: #8b90a0; line-height: 1.5; }
    .kv-v { flex: 1; min-width: 0; color: #333; line-height: 1.5; word-break: break-all; }
    .sheet-foot { display: flex; gap: 10px; padding: 12px 18px 18px; }
    .sheet-foot button { flex: 1; border-radius: 22px; font-family: inherit; font-size: 14px; padding: 12px 0; cursor: pointer; }
    .btn-ghost { border: 1px solid #dcdcdc; background: #fff; color: #555; }
    .btn-danger { border: none; background: #E60012; color: #fff; }
    .btn-danger:hover { background: #c40011; }
</style>
</head>
<body>

<!-- ==================== 手机端：报表订阅 ==================== -->
<div class="phone">
    <!-- 顶部导航（三页统一）：返回 + 页面标题＝当前 tab，三个 tab 可点击互相切换 -->
    <div class="topbar">
        <button class="topbar-back" onclick="goBack()" aria-label="返回"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <div class="top-tabs">
            <button class="top-tab" onclick="location.href='机群报表.html'">机群报表</button>
            <button class="top-tab active">报表订阅</button>
        </div>
        <button class="quick-more" title="提交报表需求" onclick="location.href='我需要更多报表.html'">＋ 提需求</button>
    </div>
    <!-- 引导（可点）：没找到合适的报表时怎么申请，居中显示 -->
    <div class="view-hint" onclick="location.href='我需要更多报表.html'">没找到需要的报表？<b>点这里申请</b>，我们会第一时间处理<span class="hint-close" title="关闭" onclick="event.stopPropagation();this.parentElement.classList.add('hidden')">×</span></div>

    <div class="app-header">
        <div class="search-wrap">
            <span class="search-icon">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>
            </span>
            <input class="search-input" id="searchInput" type="search" placeholder="搜索报表名称 / 类型 / 收件人" oninput="renderAll()">
        </div>
        <button class="add-btn" onclick="focusSearch()" aria-label="搜索报表">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="vertical-align:-2px;margin-right:4px;">
                <circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/>
            </svg>搜索
        </button>
    </div>
    <div class="screen" id="screen"></div>
    <script>
        /* 「搜索」按钮：滚动到搜索区并聚焦输入框 */
        function focusSearch() {
            const inp = document.getElementById('searchInput');
            if (!inp) return;
            const box = inp.closest('.search-box') || inp;
            if (box.scrollIntoView) box.scrollIntoView({ block: 'center', behavior: 'smooth' });
            inp.focus();
            inp.select && inp.select();
        }
    </script>

</div>

<!-- ==================== 报表详情 ==================== -->
<div class="sheet-mask" id="detailSheet" onclick="closeDetail()">
    <div class="sheet" onclick="event.stopPropagation()">
        <div class="sheet-head">
            <span class="sheet-title" id="detailTitle"></span>
            <span class="badge normal" id="detailBadge"></span>
            <span class="sheet-close" onclick="closeDetail()">✕</span>
        </div>
        <div class="sheet-body" id="detailBody"></div>
        <div class="sheet-foot">
            <button class="btn-ghost" onclick="editReport(detailId)">编辑</button>
            <button class="btn-danger" onclick="askDelete(detailId)">删除</button>
        </div>
    </div>
</div>

<!-- 删除确认 -->
<div class="mask" id="delMask" onclick="closeDel()">
    <div class="dlg" onclick="event.stopPropagation()">
        <div class="dlg-title">删除报表</div>
        <div class="dlg-text" id="delText"></div>
        <div class="dlg-btns">
            <button class="dlg-btn ghost" onclick="closeDel()">取消</button>
            <button class="dlg-btn danger" onclick="confirmDel()">删除</button>
        </div>
    </div>
</div>

<!-- 编辑订阅 -->
<div class="mask" id="editMask" onclick="closeEdit()">
    <div class="sheet edit-sheet" onclick="event.stopPropagation()">
        <div class="sheet-head">
            <span class="sheet-title">编辑报表</span>
            <span class="sheet-close" onclick="closeEdit()">✕</span>
        </div>
        <div class="edit-body">
            <div class="sec-title">基本信息</div>
            <label class="f-label">报表名称 <span class="req">*</span></label>
            <input type="text" class="f-input" id="edName" maxlength="100" placeholder="请输入报表名称">

            <div class="sec-title">推送设置</div>
            <label class="f-label">格式</label>
            <select class="f-input" id="edFormat">
                <option>XLSX</option><option>CSV</option><option>PDF</option>
            </select>

            <label class="f-label">频率</label>
            <div class="seg" id="edFreq">
                <button data-v="每日" onclick="edSetFreq('每日')">每日</button>
                <button data-v="每周" onclick="edSetFreq('每周')">每周</button>
                <button data-v="每月" onclick="edSetFreq('每月')">每月</button>
            </div>

            <div class="f-row">
                <div>
                    <label class="f-label">数据范围</label>
                    <select class="f-input" id="edScope"></select>
                </div>
                <div>
                    <label class="f-label">接收日期</label>
                    <select class="f-input" id="edRecvDay"></select>
                </div>
            </div>

            <label class="f-label">接收时区及时间</label>
            <div class="f-row">
                <select class="f-input" id="edTz">
                    <option>GMT+8</option><option>GMT+0</option><option>GMT-5</option><option>GMT+1</option>
                </select>
                <input type="time" class="f-input" id="edTime">
            </div>

            <div class="f-row">
                <div>
                    <label class="f-label">任务开始时间</label>
                    <input type="date" class="f-input" id="edStart">
                </div>
                <div>
                    <label class="f-label">任务结束时间</label>
                    <input type="date" class="f-input" id="edEnd">
                </div>
            </div>

            <div class="sec-title">收件人</div>
            <div class="f-row">
                <input type="email" class="f-input" id="edMailInput" placeholder="输入邮箱后添加">
                <button class="f-add" onclick="edAddMail()">添加</button>
            </div>
            <div class="chips" id="edMailList"></div>
        </div>
        <div class="dlg-btns">
            <button class="dlg-btn ghost" onclick="closeEdit()">取消</button>
            <button class="dlg-btn primary" onclick="saveEdit()">保存</button>
        </div>
    </div>
</div>

<script>
/* ========================================================================
 * 数据来源：海外版-V2/MysnayPC端V2/管理报表.html（同一份报表订阅 mock 数据）
 * ====================================================================== */

        projCaliber: '按行程',

    {

        dimension: 'project',
        owner: 'Admin',
        frequency: '每周',
        duration: '上周',
        caliber: '自然日',
        deliveryDate: '星期一',
        deliveryTime: '09:00',
        startDate: '2026-09-14',
        format: 'PDF',
        pdfLayout: '机群对比版',
        recipients: 'brian@centralatlantatractor.com',
        filters: '项目',
        subject: 'Jakarta North Quarry 项目能耗周报',
        datetime: '2026-09-14 09:00',
        endDate: '2026-12-31',
        timezone: 'UTC+7',

const STATUS_TEXT = {
    normal: '正常',
    expired: '已失效',
    overdue: '已过期',
    partial: '部分失效'
};

// 异常状态说明（点状态标签查看，文案取自 PC 端提示）
const STATUS_HELP = {
    overdue: '订阅的报表已超过截止日期，推送已停止。请重新设置有效期后恢复。',
    expired: '订阅中的设备已被解绑或权限已变更，报表推送已失效。请重新选择设备后恢复。',
    partial: '部分设备已被解绑或权限已变更，报表数据可能不完整。'
};

const searchInput = document.getElementById('searchInput');
const screenEl = document.getElementById('screen');
let detailId = null;

function safe(v) {
    return String(v == null ? '' : v).replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
}

function statusOf(r) {
    return r.overdue ? 'overdue' : (r.expired ? 'expired' : (r.partial ? 'partial' : 'normal'));
}

function rangeText(r) {
    const start = r.startDate || (r.datetime && r.datetime !== '-' ? r.datetime.split(' ')[0] : '');
    const end = (r.endDate && r.endDate !== '-') ? r.endDate : '';
    if (start && end) return start + ' ~ ' + end;
    if (start) return start + ' 起';
    if (end) return '至 ' + end;
    return '-';
}

function receiveTimeText(r) {
    return r.timezone ? r.timezone + (r.deliveryTime ? ' ' + r.deliveryTime : '') : '-';
}

/* ==================== 渲染：报表列表 ==================== */
function renderCard(r) {
    const st = statusOf(r);
    const locked = (st === 'overdue' || st === 'expired');
    return `
        <div class="card report-card${locked ? ' is-expired' : ''}">
            <div class="rc-head">
                <div class="rc-name">${safe(r.name)}</div>
                <span class="badge ${st}"${st === 'normal' ? '' : ' onclick="explainStatus(event, \'' + st + '\')"'}>${STATUS_TEXT[st]}</span>
            </div>
            <div class="rc-meta">
                <span class="m-left" title="${safe((r.frequency || '') + ' · ' + (r.format || '') + ' · ' + (r.deliveryTime || '') + ' 推送 · 数据范围 ' + (r.duration || '-') + ' · 收件人 ' + ((r.recipients || '').split(/[,，;]/).filter(Boolean).length || 0) + ' 人')}">
                    <span class="m-chip is-freq">${safe(r.frequency || '')}</span>
                    <span class="m-chip">${safe(r.format || '')}</span>
                    <span class="m-chip is-time">${safe(r.deliveryDate && r.deliveryDate !== '-' ? r.deliveryDate + ' ' : '')}${safe(r.deliveryTime || '')} 推送</span>
                </span>
                <span class="m-right">创建 ${safe((r.createTime || '').slice(5))}</span>
            </div>
            <div class="rc-foot">
                <label class="switch">
                    <input type="checkbox" ${(!locked && r.enabled) ? 'checked' : ''} ${locked ? 'disabled' : ''} onchange="toggleEnabled(${r.id}, this.checked)">
                    <span class="track"></span>
                </label>
                <span class="switch-label">${(!locked && r.enabled) ? '开启' : '关闭'}</span>
                <div class="rc-actions">
                    ${locked ? '' : '<span class="link" onclick="editReport(' + r.id + ')">编辑</span>'}
                    <span class="link danger" onclick="askDelete(${r.id})">删除</span>
                </div>
            </div>
        </div>`;
}

/* ==================== 渲染：报表列表 ==================== */
function renderAll() {
    const kw = searchInput.value.trim().toLowerCase();
    const list = reportList.filter(function (r) {
        if (!kw) return true;
        return [r.name, r.type, r.owner, r.recipients, r.subject, r.assets].some(function (v) {
            return String(v || '').toLowerCase().indexOf(kw) >= 0;
        });
    }).slice().sort(function (a, b) {
        /* 按创建时间倒序：新创建的排前面 */
        return String(b.createTime || '').localeCompare(String(a.createTime || ''));
    });

    if (!list.length) {
        screenEl.innerHTML = '<div class="empty-wrap">'
            + '<div class="empty-title">未找到匹配的报表</div>'
            + '<div class="empty-sub">换个关键词试试</div>'
            + '</div>';
        return;
    }
    screenEl.innerHTML = list.map(renderCard).join('');
}

/* ==================== 交互 ==================== */
function explainStatus(e, st) {
    if (e) e.stopPropagation();
    showToast(STATUS_HELP[st] || '');
}

function toggleEnabled(id, checked) {
    const r = reportList.filter(function (x) { return x.id === id; })[0];
    if (!r) return;
    r.enabled = checked;
    renderAll();
    showToast(checked ? '已开启推送：' + r.name : '已关闭推送：' + r.name);
}

/* ==================== 详情面板 ==================== */
function openDetail(id) {
    const r = reportList.filter(function (x) { return x.id === id; })[0];
    if (!r) return;
    detailId = id;
    const isProject = r.dimension === 'project';
    const st = statusOf(r);
    const recipients = String(r.recipients || '').split(';').map(function (s) { return s.trim(); }).filter(Boolean);

    const info = [
        { label: '报表类型', value: r.type },
        { label: '报表维度', value: isProject ? '项目维度' : '设备维度' },
        { label: '格式', value: r.format || 'XLSX' },
        { label: '频率', value: r.frequency },
        { label: '数据范围', value: r.duration || '-' },
        { label: '接收日期', value: (r.deliveryDate && r.deliveryDate !== '-') ? r.deliveryDate : (r.frequency === '每日' ? '每天' : '-') },
        { label: '接收时区及时间', value: (r.timezone || 'GMT+8') + ' ' + (r.deliveryTime || '-') },
        { label: '任务开始时间', value: r.startDate || '-' },
        { label: '任务结束时间', value: r.endDate || '-' },
        { label: isProject ? '涉及项目' : '涉及资产', value: r.assets }
    ];

    const rowsHTML = function (arr) {
        return '<div class="kv">' + arr.map(function (it) {
            return '<div class="kv-row"><span class="kv-k">' + it.label + '</span><span class="kv-v">' + safe(it.value) + '</span></div>';
        }).join('') + '</div>';
    };

    document.getElementById('detailTitle').textContent = r.name;
    const badge = document.getElementById('detailBadge');
    badge.className = 'badge ' + st;
    badge.textContent = STATUS_TEXT[st];
    badge.onclick = (st === 'normal') ? null : function () { showToast(STATUS_HELP[st] || ''); };

    document.getElementById('detailBody').innerHTML = '<div class="sheet-sub">基本信息</div>'
        + rowsHTML(info)
        + '<div class="sheet-sub">收件人信息</div>'
        + rowsHTML([
            { label: '收件人数量', value: recipients.length + ' 人' },
            { label: '收件人列表', value: r.recipients }
        ]);

    document.getElementById('detailSheet').classList.add('active');
}

function closeDetail() {
    document.getElementById('detailSheet').classList.remove('active');
    detailId = null;
}

/* ==================== 编辑订阅 ==================== */
let editId = null;
let editMails = [];
let editFreq = '每日';

const ED_SCOPE = { '每日': ['前一天'], '每周': ['上周'], '每月': ['上个月'] };
const ED_DAY = {
    '每日': ['每天'],
    '每周': ['星期一', '星期二', '星期三', '星期四', '星期五', '星期六', '星期日'],
    '每月': Array.from({ length: 28 }, function (_, i) { return (i + 1) + ' 号'; })
};

function editReport(id) {
    const r = reportList.filter(function (x) { return x.id === id; })[0];
    if (!r) return;
    editId = id;
    editMails = String(r.recipients || '').split(';').map(function (v) { return v.trim(); }).filter(Boolean);

    document.getElementById('edName').value = r.name || '';
    document.getElementById('edFormat').value = r.format || 'XLSX';
    editFreq = r.frequency || '每日';
    edSetFreq(editFreq);
    /* 时区兼容旧值（UTC+8 等），统一映射到可选项 */
    const tzMap = { 'UTC+8': 'GMT+8', 'UTC': 'GMT+0', 'UTC-5': 'GMT-5', 'UTC+1': 'GMT+1' };
    const tzSel = document.getElementById('edTz');
    const wantTz = tzMap[r.timezone] || r.timezone || 'GMT+8';
    tzSel.value = Array.prototype.some.call(tzSel.options, o => o.value === wantTz || o.text === wantTz) ? wantTz : 'GMT+8';
    document.getElementById('edTime').value = (r.deliveryTime || '09:00');
    document.getElementById('edStart').value = r.startDate || '';
    document.getElementById('edEnd').value = (r.endDate && r.endDate !== '-') ? r.endDate : '';
    document.getElementById('edMailInput').value = '';
    renderEditMails();
    document.getElementById('editMask').classList.add('show');
}

function closeEdit() {
    document.getElementById('editMask').classList.remove('show');
    editId = null;
}

function edSetFreq(f) {
    editFreq = f;
    document.querySelectorAll('#edFreq button').forEach(function (b) {
        b.classList.toggle('on', b.getAttribute('data-v') === f);
    });
    const scopeSel = document.getElementById('edScope');
    const daySel = document.getElementById('edRecvDay');
    if (scopeSel) {
        scopeSel.innerHTML = (ED_SCOPE[f] || ED_SCOPE['每日'])
            .map(function (o) { return '<option>' + o + '</option>'; }).join('');
    }
    if (daySel) {
        daySel.innerHTML = (ED_DAY[f] || ED_DAY['每日'])
            .map(function (o) { return '<option>' + o + '</option>'; }).join('');
    }
}

function renderEditMails() {
    const box = document.getElementById('edMailList');
    if (!box) return;
    box.innerHTML = editMails.map(function (m) {
        return '<span class="chip">' + m + '<span onclick="edDelMail(\'' + m + '\')">×</span></span>';
    }).join('');
}

function edAddMail() {
    const input = document.getElementById('edMailInput');
    const v = (input.value || '').trim();
    if (!v) { showToast('请输入邮箱地址'); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) { showToast('邮箱格式不正确'); return; }
    if (editMails.indexOf(v) >= 0) { showToast('该收件人已添加'); return; }
    editMails.push(v);
    input.value = '';
    renderEditMails();
}

function edDelMail(m) {
    editMails = editMails.filter(function (x) { return x !== m; });
    renderEditMails();
}

function saveEdit() {
    const r = reportList.filter(function (x) { return x.id === editId; })[0];
    if (!r) return;
    const newName = (document.getElementById('edName').value || '').trim();
    if (!newName) { showToast('请填写报表名称'); return; }
    if (!editMails.length) { showToast('请至少保留一个收件人'); return; }

    r.name = newName;
    r.format = document.getElementById('edFormat').value;
    r.frequency = editFreq;
    r.duration = document.getElementById('edScope').value;
    r.deliveryDate = document.getElementById('edRecvDay').value;
    r.timezone = document.getElementById('edTz').value;
    if (!r.timezone) r.timezone = 'GMT+8';
    r.deliveryTime = document.getElementById('edTime').value;
    r.startDate = document.getElementById('edStart').value;
    r.endDate = document.getElementById('edEnd').value;
    r.recipients = editMails.join('; ');

    closeEdit();
    renderAll();
    if (detailId === r.id) openDetail(r.id);   /* 详情同步刷新 */
    showToast('报表已保存');
}

/* ==================== 删除 ==================== */
let delId = null;

function askDelete(id) {
    const r = reportList.filter(function (x) { return x.id === id; })[0];
    if (!r) return;
    delId = id;
    document.getElementById('delText').innerHTML =
        '删除后将停止推送且无法恢复，确定要删除该报表吗？';
    document.getElementById('delMask').classList.add('show');
}

function closeDel() {
    document.getElementById('delMask').classList.remove('show');
    delId = null;
}

function confirmDel() {
    const id = delId;
    if (id == null) return;
    reportList = reportList.filter(function (x) { return x.id !== id; });
    if (detailId === id) closeDetail();
    closeDel();
    renderAll();
    showToast('报表已删除');
}

/* 返回上一页（无历史记录时只提示一下） */
function goBack() {
    if (history.length > 1) { history.back(); return; }
    showToast('返回上一页');
}

function showToast(msg) {
    const t = document.createElement('div');
    t.textContent = msg;
    t.style.cssText = 'position:fixed;left:50%;bottom:60px;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;'
        + 'font-size:12px;padding:9px 16px;border-radius:18px;z-index:99;max-width:80%;text-align:center;';
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 1800);
}

/* ==================== 初始化 ==================== */
renderAll();
</script>

<!-- EMBED_PATCH：被「机群报表」页以 iframe 内嵌时，隐藏自带的顶部导航与引导条 -->
<script>
(function () {
    if (location.search.indexOf('embed=1') < 0) return;
    document.addEventListener('DOMContentLoaded', function () {
        var bar = document.querySelector('.topbar');
        var hint = document.querySelector('.view-hint');
        if (bar && bar.parentNode) bar.parentNode.removeChild(bar);
        if (hint && hint.parentNode) hint.parentNode.removeChild(hint);
        document.body.classList.add('embedded');
    });
})();
</script>
