<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>报表模版（v2.0）</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: #f5f6f8;
            color: #333;
        }

        .app-wrapper {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .main-wrapper {
            display: flex;
            flex: 1;
        }

        /* 顶部导航栏 */
        .navbar {
            height: 50px;
            background: #fff;
            border-bottom: 1px solid #e8e8e8;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            flex-shrink: 0;
        }

        .navbar-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: #E60012;
            letter-spacing: -0.5px;
        }

        .navbar-right {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 14px;
            color: #666;
        }

        .navbar-item {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .navbar-item:hover {
            color: #E60012;
        }

        .navbar-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #f0f0f0;
            overflow: hidden;
        }

        /* 侧边栏 */
        .sidebar {
            width: 210px;
            background: #fff;
            border-right: 1px solid #e8e8e8;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow-y: auto;
        }

        .sidebar-menu {
            list-style: none;
            padding: 8px 0;
        }

        .sidebar-item {
            position: relative;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            font-size: 14px;
            color: #666;
            text-decoration: none;
            transition: all 0.2s;
            cursor: pointer;
        }

        .sidebar-link:hover {
            color: #E60012;
            background: #fff5f5;
        }

        .sidebar-item.active > .sidebar-link,
        .sidebar-link.active {
            background: #E60012;
            color: #fff;
            font-weight: 500;
        }

        .sidebar-item.active > .sidebar-link:hover,
        .sidebar-link.active:hover {
            background: #cc0010;
            color: #fff;
        }

        .sidebar-submenu {
            list-style: none;
            padding: 0;
        }

        .sidebar-submenu .sidebar-link {
            padding-left: 42px;
            font-size: 13px;
        }

        .sidebar-icon {
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* 主内容区 */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            background: #f5f6f8;
        }

        .container {
            max-width: 100%;
            margin: 0;
            padding: 0;
        }

        .page-card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }

        /* 顶部标签页 */
        .tabs {
            display: flex;
            border-bottom: 1px solid #e8e8e8;
        }

        .tab {
            padding: 16px 24px;
            font-size: 15px;
            color: #666;
            cursor: pointer;
            position: relative;
            transition: color 0.2s;
            text-decoration: none;
        }

        .tab:hover {
            color: #E60012;
        }

        .tab.active {
            color: #333;
            font-weight: 500;
        }

        .tab.active::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background-color: #E60012;
        }

        /* 顶部标签页右侧的「我需要更多报表」入口 */
        .tabs-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            padding-right: 24px;
        }

        .more-reports-entry {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 32px;
            padding: 0 14px;
            font-size: 13px;
            font-family: inherit;
            color: #E60012;
            background: #fff;
            border: 1px solid #E60012;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .more-reports-entry:hover {
            background: #E60012;
            color: #fff;
        }

        .more-reports-entry svg { flex-shrink: 0; }

        /* 工具栏 */
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            border-bottom: 1px solid #f0f0f0;
        }

        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search-box {
            display: flex;
            align-items: center;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            padding: 0 12px;
            height: 32px;
            width: 280px;
            transition: border-color 0.2s;
        }

        .search-box:focus-within {
            border-color: #E60012;
        }

        .search-box svg {
            color: #999;
            margin-right: 8px;
            flex-shrink: 0;
        }

        .search-box input {
            border: none;
            outline: none;
            font-size: 13px;
            width: 100%;
            color: #333;
        }

        .search-box input::placeholder {
            color: #bfbfbf;
        }

        .toolbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .view-toggle {
            display: flex;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            overflow: hidden;
        }

        .view-toggle button {
            padding: 6px 12px;
            font-size: 13px;
            border: none;
            background: #fff;
            color: #666;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .view-toggle button.active {
            background: #595959;
            color: #fff;
        }

        .view-toggle button:not(.active):hover {
            color: #E60012;
        }

        /* ====== 列表视图 ====== */
        .dim-list-view {
            display: flex;
            flex-direction: column;
            gap: 0;
            padding: 24px;
        }

        .dim-list-item {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            background: #fff;
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.15s;
            gap: 16px;
        }

        .dim-list-item:hover {
            background: #fafafa;
        }

        .dim-list-item .list-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .dim-list-item .list-icon svg {
            width: 20px;
            height: 20px;
        }

        .dim-list-item .list-info {
            flex: 1;
            min-width: 0;
        }

        .dim-list-item .list-name {
            font-size: 14px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 2px;
        }

        .dim-list-item .list-desc {
            font-size: 12px;
            color: #999;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .dim-list-item .list-fields {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            flex: 1;
            min-width: 0;
            justify-content: center;
        }

        .dim-list-item .list-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        /* 模板网格 */
        .template-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
            padding: 24px;
        }



        .template-card {
            background: #fff;
            border: 1px solid #e8e8e8;
            border-radius: 8px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            transition: box-shadow 0.2s, border-color 0.2s;
        }

        .template-card:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            border-color: #d9d9d9;
        }

        .template-card-header {
            margin-bottom: 12px;
        }

        .template-card-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .template-card-desc {
            font-size: 13px;
            color: #999;
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .template-card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 24px;
        }

        .btn-link {
            font-size: 13px;
            color: #E60012;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            transition: opacity 0.2s;
        }

        .btn-link:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        .btn-primary {
            background: #E60012;
            border: none;
            border-radius: 4px;
            padding: 0 16px;
            height: 32px;
            font-size: 13px;
            font-weight: 500;
            color: #fff;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: #cc0010;
        }

        /* 空状态 */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 24px;
            color: #999;
        }

        .empty-illustration {
            width: 120px;
            height: 120px;
            margin-bottom: 16px;
            opacity: 0.6;
        }

        .empty-text {
            font-size: 14px;
            color: #999;
        }

        /* 预览弹窗 */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 40px 24px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #fff;
            border-radius: 8px;
            width: 100%;
            max-width: 1100px;
            max-height: 92vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 28px;
            border-bottom: 1px solid #e8e8e8;
            flex-shrink: 0;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .modal-close {
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .modal-close:hover {
            color: #333;
            background: #f5f5f5;
        }

        .modal-body {
            overflow-y: auto;
            flex: 1;
        }

        .modal-footer {
            padding: 12px 24px;
            border-top: 1px solid #f0f0f0;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            flex-shrink: 0;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 32px;
            padding: 0 16px;
            font-size: 13px;
            border-radius: 4px;
            border: 1px solid #d9d9d9;
            background: #fff;
            color: #333;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover { border-color: #E60012; color: #E60012; }
        .btn-primary {
            background: #E60012;
            border-color: #E60012;
            color: #fff;
        }
        .btn-primary:hover { background: #cc0010; border-color: #cc0010; color: #fff; }

        /* ====== 「我需要更多报表」诉求弹窗 ====== */
        .more-section-title {
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }
        .more-option {
            display: flex;
            gap: 10px;
            padding: 12px 14px;
            border: 1px solid #f0f0f0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .more-option + .more-option { margin-top: 10px; }
        .more-option:hover { border-color: #E60012; background: #fffafa; }
        /* 整卡可点：隐藏原生复选框，选中 = 卡片淡红底 + 红边 */
        .more-option {
            position: relative;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        .more-option:active { background: #fafbfc; }
        .more-option input { position: absolute; opacity: 0; width: 0; height: 0; }
        .more-option.checked { border-color: #f6a8ae; background: #fff7f7; }
        /* 分组标题行右侧「已选 N 项」 */
        .more-section-title { display: flex; align-items: center; justify-content: space-between; }
        .more-section-title .sel-count {
            font-size: 12px;
            font-weight: 400;
            color: #E60012;
        }
        .more-option-name {
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 3px;
        }
        .more-option-desc {
            font-size: 12px;
            color: #888;
            line-height: 1.5;
        }
        .more-option-tag {
            display: inline-block;
            margin-left: 6px;
            font-size: 10px;
            font-weight: 400;
            padding: 1px 6px;
            border-radius: 3px;
            vertical-align: middle;
        }
        .more-option-tag.planned { color: #1890ff; background: #e6f4ff; }
        .more-option-tag.apply   { color: #fa8c16; background: #fff7e6; }
        /* 候选项缩略图：hover 出现放大镜蒙层，提示可点击看大图 */
        .more-option-thumb {
            position: relative;
            width: 104px;
            height: 72px;
            flex-shrink: 0;
            border: 1px solid #ececec;
            border-radius: 8px;
            background: #fafafa;
            overflow: hidden;
            cursor: zoom-in;
        }
        .more-option-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.25s ease;
        }
        .more-option-thumb:hover { border-color: #E60012; }
        .more-option-thumb:hover img { transform: scale(1.06); }
        .more-option-thumb .zoom {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.42);
            color: #fff;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .more-option-thumb:hover .zoom { opacity: 1; }

        /* 预览图放大（点击缩略图直接出大图；点任意位置/按 Esc 关闭）
           层级要高于新手引导遮罩(9998/10000)与弹窗(1000) */
        #reportPreview {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 10050;
            padding: 32px;
            background: rgba(0,0,0,0.82);
            -webkit-backdrop-filter: blur(3px);
            backdrop-filter: blur(3px);
            align-items: center;
            justify-content: center;
            cursor: zoom-out;
        }
        #reportPreview.active { display: flex; }
        #reportPreviewImg {
            display: block;
            max-width: 88vw;
            max-height: 84vh;
            object-fit: contain;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 24px 60px rgba(0,0,0,0.45);
            animation: rpIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes rpIn {
            from { opacity: 0; transform: scale(0.97); }
            to   { opacity: 1; transform: none; }
        }
        @media (max-width: 640px) {
            #reportPreview { padding: 16px; }
            #reportPreviewImg { max-width: 96vw; max-height: 78vh; }
        }
        .more-note-input {
            width: 100%;
            min-height: 96px;
            padding: 10px 12px;
            font-size: 13px;
            font-family: inherit;
            line-height: 1.6;
            color: #333;
            border: 1px solid #d9d9d9;
            border-radius: 8px;
            resize: vertical;
            box-sizing: border-box;
        }
        .more-note-input:focus { outline: none; border-color: #E60012; }
        .more-form-tip {
            font-size: 12px;
            margin-top: 10px;
            display: none;
        }
        .more-form-tip.error   { display: block; color: #E60012; }
        .more-form-tip.success { display: block; color: #52c41a; }

        /* 邮件预览区 */
        .email-preview {
            border: none;
            background: #f9f9fb;
        }
        .email-preview-header {
            background: #f5f5f5;
            padding: 12px 20px;
            font-size: 12px;
            color: #999;
            display: flex;
            flex-direction: column;
            gap: 4px;
            border-bottom: 1px solid #e8e8e8;
        }
        .email-preview-header .ph-row {
            display: flex;
            gap: 8px;
        }
        .email-preview-header .ph-label {
            color: #666;
            min-width: 48px;
            text-align: right;
            flex-shrink: 0;
        }
        .email-preview-header .ph-value {
            color: #333;
            font-weight: 500;
        }
        .email-preview-body {
            padding: 24px 28px;
            font-size: 13px;
            color: #333;
            line-height: 1.8;
            max-height: 480px;
            overflow-y: auto;
            background: #fff;
        }
        .email-preview-body .report-title {
            font-size: 18px;
            font-weight: 700;
            color: #E60012;
            text-align: center;
            margin-bottom: 6px;
        }
        .email-preview-body .report-subtitle {
            font-size: 12px;
            color: #999;
            text-align: center;
            margin-bottom: 20px;
        }
        .email-preview-body .report-section {
            margin-bottom: 16px;
        }
        .email-preview-body .report-section h4 {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            padding-left: 8px;
            border-left: 3px solid #E60012;
        }
        .email-preview-body table {
            width: 100%;
            margin: 12px 0;
            font-size: 12px;
            border-collapse: collapse;
        }
        .email-preview-body table th {
            background: #f5f5f5;
            padding: 8px 10px;
            text-align: center;
            font-weight: 500;
            color: #555;
            border: 1px solid #e8e8e8;
        }
        .email-preview-body table td {
            padding: 7px 10px;
            text-align: center;
            border: 1px solid #e8e8e8;
            color: #333;
        }
        .email-footer {
            margin-top: 20px;
            padding-top: 12px;
            border-top: 1px solid #f0f0f0;
            font-size: 11px;
            color: #bbb;
            text-align: center;
            line-height: 1.8;
        }

        /* 报告头部信息 */
        .report-header {
            background: #fafafa;
            padding: 20px 28px;
            border-bottom: 1px solid #f0f0f0;
        }

        .report-header-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
        }

        .report-header-meta {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 8px 32px;
        }

        .report-meta-item {
            display: flex;
            gap: 8px;
            font-size: 13px;
        }

        .report-meta-label {
            color: #999;
            white-space: nowrap;
        }

        .report-meta-value {
            color: #333;
        }

        /* 预览表格区域 */
        .preview-table-wrap {
            padding: 0;
            overflow-x: auto;
        }

        .preview-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            min-width: 800px;
        }

        .preview-table thead th {
            background: #fafafa;
            color: #666;
            text-align: left;
            padding: 14px 16px;
            border-bottom: 1px solid #e8e8e8;
            font-weight: 500;
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        .preview-table tbody td {
            padding: 12px 16px;
            border-bottom: 1px solid #f0f0f0;
            color: #333;
        }

        .preview-table tbody tr:hover {
            background: #fafafa;
        }

        .preview-table .group-header-row th.group-header {
            background: #e6f0ff;
            color: #1a6de0;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            padding: 8px 4px;
            border-bottom: 2px solid #bdd7f5;
            letter-spacing: 1px;
        }

        .preview-table .summary-row {
            background: #f9fafb;
        }

        .preview-table .summary-row td {
            padding: 8px 16px;
            border-bottom: 2px solid #e8e8e8;
            font-size: 12px;
        }

        .preview-table .summary-row td strong {
            color: #333;
        }

        .preview-table .col-name {
            color: #E60012;
            font-weight: 500;
        }

        .preview-table .col-asset {
            color: #E60012;
            font-weight: 500;
        }

        .preview-table .cell-tag {
            display: inline-block;
            padding: 0 6px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 500;
        }

        .preview-table .cell-tag.good { background: #f6ffed; color: #52c41a; }

    <script>
        /* 被 App 端页面以 iframe 嵌入预览时（?embed=1）：隐藏左侧菜单、不弹引导，并让页内跳转继续保持嵌入 */
        (function () {
            if (!/[?&]embed=1/.test(location.search)) return;
            document.documentElement.classList.add('embed');
            document.addEventListener('DOMContentLoaded', function () {
                document.querySelectorAll('a[href$=".html"]').forEach(function (a) {
                    var h = a.getAttribute('href');
                    if (h.indexOf('embed=1') < 0) a.setAttribute('href', h + (h.indexOf('?') < 0 ? '?' : '&') + 'embed=1');
                });
            });
        })();

              desc:'列出设备已完成或部分完成的工地访问记录：已完成 = 有对应的入场与出场事件；部分完成 = 已有入场事件但尚未产生出场事件。', metrics:[] },

            // ================= 项目维度（v2.0 新增 5 张）=================,
            { key:'proj_production', scope:'项目', name:'项目生产报表（按行程）', en:'Project Production by Trip', group:'项目维度', nature:'项目维度', icon:'summary',
              desc:'按一次装载任务（Trip）计算项目产出与循环效率。',
              metrics:['行程数','平均循环时间(min)','总运距(km)','利用率(%)'], vals:[186, 18.4, 2412.6, 99.2], intCols:[0] },
            { key:'proj_efficiency', scope:'项目', name:'项目效率报表', en:'Project Efficiency', group:'项目维度', nature:'项目维度', icon:'clock',
              desc:'哪个设备、哪个环节拖慢项目，做设备间对比。',
              metrics:['运行时长(h)','行程数','单行程耗时(min)','利用率(%)'], vals:[284.4, 186, 18.4, 99.2], intCols:[1] },
            { key:'proj_energy', scope:'项目', name:'项目能耗报表', en:'Project Energy', group:'项目维度', nature:'项目维度', icon:'fuel',
              desc:'项目整体能耗与单位运输能耗。',
              metrics:['总能耗(L)','单行程能耗(L)','百公里能耗(L/100km)'], vals:[5669.0, 30.5, 26.4] },
            { key:'proj_safety', scope:'项目', name:'项目安全报表', en:'Project Safety', group:'项目维度', nature:'项目维度', icon:'event',
              desc:'超速、急刹、告警按项目汇总。',
              metrics:['超速时长(h)','超速占比(%)','急刹次数','告警次数'], vals:[1.8, 0.6, 4, 6], intCols:[2,3] },
            { key:'proj_assets', scope:'项目', name:'项目设备清单报表', en:'Project Asset List', group:'项目维度', nature:'项目维度', icon:'fleet',
              desc:'项目在册设备一览与状态。',
              metrics:['机型','状态','工时(h)','里程(km)'], vals:['挖掘机 SY215', '在线', 284.4, 128.6] },
        ];

        // ====================================================================
        // 状态与 DOM 引用
        // ====================================================================
        let currentViewMode = 'grid'; // 'grid' | 'list'
        let previewState = { key: reports[0].key, format: 'table' }; // 口径由报表决定；format: 'table' | 'pdf'
        const searchInput = document.getElementById('templateSearch');
        const templateContent = document.getElementById('templateContent');

        // ====================================================================
        // 示例数据：同一套字段，按取数范围生成单机 / 机群两种视图
        // ====================================================================
        const PERIOD = '2026-09-01 ~ 2026-09-30';
        const FLEET_DEVICES = ['F3S01395', 'F3S01402', 'F3S01418'];
        const FLEET_FACTORS = [1, 0.88, 0.71];

        function cellText(rep, ci, v, factor) {
            if (typeof v !== 'number') return v;
            const x = v * factor;
            return (rep.intCols || []).indexOf(ci) >= 0 ? String(Math.round(x)) : x.toFixed(1);
        }

        function buildTable(rep, view) {
            const cols = view === 'single'
                ? ['统计周期', '设备机型', '设备编号'].concat(rep.metrics)
                : ['统计周期', '设备编号'].concat(rep.metrics);
            const rows = view === 'single'
                ? [[PERIOD, '挖掘机 SY215', 'F3S01395'].concat(rep.vals.map(function (v, i) { return cellText(rep, i, v, 1); }))]
                : FLEET_DEVICES.map(function (id, k) {
                      return [PERIOD, id].concat(rep.vals.map(function (v, i) { return cellText(rep, i, v, FLEET_FACTORS[k]); }));
                  });
            return { cols: cols, rows: rows };
        }

        // 口径徽标（单机 / 机群 / 项目）：口径由报表本身决定，页面不再提供切换
        function scopeTag(rep) {
            const st = {
                '单机': 'color:#5a6472;background:#f1f3f6;',
                '机群': 'color:#E60012;background:#fdecee;',
                '项目': 'color:#7C3AED;background:#f3ecff;'
            }[rep.scope] || 'color:#8b90a0;background:#f2f3f5;';
            return '<span style="display:inline-block;margin-left:6px;font-size:10px;font-weight:400;border-radius:3px;padding:1px 6px;vertical-align:middle;' + st + '">' + (rep.scope || '') + '</span>';
        }

        // ====================================================================
        // 渲染：卡片（网格） / 行（列表）—— 页面只有报表卡片，不区分单机 / 机群
        // ====================================================================
        function renderCard(rep) {
            return `
                <div class="dim-card-unified${rep.metrics.length ? '' : ' is-disabled'}" data-key="${rep.key}">
                    <div class="card-body">
                        <div class="card-head-row">
                            <div class="card-icon dim-icon-summary">${ICONS[rep.icon] || ICONS.summary}</div>
                            <div style="flex:1;min-width:0;">
                                <div class="card-title">${rep.name}${scopeTag(rep)}</div>
                                <div class="card-subtitle">${rep.group} · ${rep.desc}</div>
                            </div>
                        </div>
                        ${rep.metrics.length ? '' : '<div class="fields-row"><span class="field-chip" style="color:#b8b8b8;background:#f2f2f2;">正在开发</span></div>'}
                    </div>
                    <div class="card-footer">
                        <div style="display:flex;gap:8px;margin-left:auto;">
                            <button class="btn-link" data-action="preview" data-key="${rep.key}">预览</button>
                            ${rep.metrics.length ? '<button class="btn-primary" data-action="add" data-key="' + rep.key + '">添加</button>' : ''}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderListItem(rep) {
            return `
                <div class="dim-list-item${rep.metrics.length ? '' : ' is-disabled'}" data-key="${rep.key}">
                    <div class="list-icon dim-icon-summary">${ICONS[rep.icon] || ICONS.summary}</div>
                    <div class="list-info">
                        <div class="list-name">${rep.name}${scopeTag(rep)}</div>
                        <div class="list-desc">${rep.group} · ${rep.desc}</div>
                    </div>
                    <div class="list-fields">
                        ${rep.metrics.length ? '' : '<span class="field-chip" style="color:#b8b8b8;background:#f2f2f2;">正在开发</span>'}
                    </div>
                    <div class="list-actions">
                        <button class="btn-link" data-action="preview" data-key="${rep.key}">预览</button>
                        ${rep.metrics.length ? '<button class="btn-primary" data-action="add" data-key="' + rep.key + '">添加</button>' : ''}
                    </div>
                </div>
            `;
        }

        function rep2match(r, kw) {
            return r.metrics.some(function (m) { return m.toLowerCase().indexOf(kw) >= 0; });
        }

        // 报表性质分组顺序
        const NATURE_ORDER = ['设备概览', '能耗与成本', '作业与效率', '安全与事件', '位置与维保', '发电机', '项目维度'];

        function renderAll() {
            const kw = searchInput.value.trim().toLowerCase();
            const list = reports.filter(function (r) {
                return !kw
                    || r.name.toLowerCase().indexOf(kw) >= 0
                    || r.en.toLowerCase().indexOf(kw) >= 0
                    || r.desc.toLowerCase().indexOf(kw) >= 0
                    || rep2match(r, kw);
            });

            if (list.length === 0) {
                templateContent.innerHTML = '<div class="empty-state"><div class="empty-text">未找到匹配的报表</div></div>';
                return;
            }

            const groups = NATURE_ORDER
                .map(function (nat) {
                    return { name: nat, items: list.filter(function (r) { return r.nature === nat; }) };
                })
                .filter(function (g) { return g.items.length > 0; });
            const rest = list.filter(function (r) { return NATURE_ORDER.indexOf(r.nature) < 0; });
            if (rest.length) groups.push({ name: '其他', items: rest });

            templateContent.innerHTML = groups.map(function (g) {
                const inner = currentViewMode === 'list'
                    ? '<div class="dim-list-view">' + g.items.map(renderListItem).join('') + '</div>'
                    : '<div class="dim-cards-grid" style="padding:0;">' + g.items.map(renderCard).join('') + '</div>';
                return '<section class="dimension-section">'
                    + '<div class="dimension-header">'
                    + '<div class="dimension-name">' + g.name + '</div>'
                    + '<div class="dimension-desc">' + g.items.length + ' 张报表</div>'
                    + '</div>'
                    + inner
                    + '</section>';
            }).join('');
        }

        // ====================================================================
        // 视图切换：网格 / 列表
        // ====================================================================
        document.querySelector('.view-toggle').addEventListener('click', function (e) {
            const btn = e.target.closest('button');
            if (!btn) return;
            const btns = Array.prototype.slice.call(document.querySelectorAll('.view-toggle button'));
            const newMode = btns.indexOf(btn) === 0 ? 'grid' : 'list';
            if (newMode === currentViewMode) return;
            currentViewMode = newMode;
            btns.forEach(function (b) { b.classList.remove('active'); });
            btn.classList.add('active');
            renderAll();
        });

        // ====================================================================
        // 搜索
        // ====================================================================
        searchInput.addEventListener('input', renderAll);

        // ====================================================================
        // 卡片按钮事件委托
        // ====================================================================
        templateContent.addEventListener('click', function (e) {
            const btn = e.target.closest('button[data-action]');
            if (!btn) return;
            const rep = reports.filter(function (r) { return r.key === btn.dataset.key; })[0];
            if (!rep) return;
            if (btn.dataset.action === 'preview') {
                openPreviewModal(rep.key);
            } else if (btn.dataset.action === 'add') {
                if (confirm('已选择报表：' + rep.name + '（' + rep.scope + '口径）\n\n将在「管理报表」页面中配置报表信息。\n是否立即前往？')) {
                    window.location.href = '管理报表.html';
                }
            }
        });

        // ====================================================================
        // 预览弹窗：单机 / 机群 的差异放在这里切换
        // ====================================================================
        const previewModal = document.getElementById('previewModal');
        const previewTableContainer = document.getElementById('previewTableContainer');
        const previewCloseBtn = document.getElementById('previewClose');
        const previewTitle = document.querySelector('#previewModal .modal-title');

        // 口径 → 示例数据视图：单机 = 单行（含机型），机群 / 项目 = 多行设备
        function scopedView(rep) {
            return rep.scope === '单机' ? 'single' : 'fleet';
        }

        function openPreviewModal(key) {
            const rep = reports.filter(function (r) { return r.key === key; })[0];
            if (!rep) return;
            previewState = { key: key, format: previewState.format || 'table' };
            renderPreviewContent();
            previewModal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // ====================================================================
        // PDF 版式预览：按导出 PDF 的版式渲染（页眉 / 指标卡 / 图表 / 明细表 / 页脚）
        // 数据仍为同一份示例数据，仅示意「报表模版 + 字段」在 PDF 里的样子
        // ====================================================================
        function pdfNum(v) {
            const n = parseFloat(String(v).replace(/[^0-9.\-]/g, ''));
            return isNaN(n) ? NaN : n;
        }

        // 机群口径：多个设备按列合计（整数列取整）
        function pdfScale(rows, ci, rep, metricIndex) {
            const nums = rows.map(function (r) { return pdfNum(r[ci]); }).filter(function (n) { return !isNaN(n); });
            if (!nums.length) return rows[0][ci];
            const sum = nums.reduce(function (a, b) { return a + b; }, 0);
            return (rep.intCols || []).indexOf(metricIndex) >= 0 ? String(Math.round(sum)) : sum.toFixed(1);
        }

        // 简版柱状图（内联 SVG，PDF 安全子集：只用 rect / line / text）
        function pdfBarChart(values, labels) {
            const W = 700, H = 170, padL = 44, padR = 10, padT = 16, padB = 28;
            const max = Math.max.apply(null, values) || 1;
            const band = (W - padL - padR) / values.length;
            const bw = Math.min(40, band * 0.52);
            let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block">';
            s += '<line x1="' + padL + '" y1="' + (H - padB) + '" x2="' + (W - padR) + '" y2="' + (H - padB) + '" stroke="#e6ebf2"/>';
            values.forEach(function (v, i) {
                const h = Math.max(2, (H - padT - padB) * (v / max));
                const x = padL + band * i + (band - bw) / 2;
                const y = H - padB - h;
                s += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="3" fill="#E60012"/>';
                s += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (y - 6).toFixed(1) + '" font-size="11" fill="#161a2e" text-anchor="middle">' + (Math.round(v * 10) / 10) + '</text>';
                s += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - padB + 16) + '" font-size="11" fill="#8b90a0" text-anchor="middle">' + labels[i] + '</text>';
            });
            s += '</svg>';
            return s;
        }

        function renderPdfPreview(rep, view) {
            const t = buildTable(rep, view);
            const base = view === 'single' ? 3 : 2;
            const metricNames = t.cols.slice(base);
            const idCol = base - 1;
            const scope = view === 'single' ? '单机口径' : '机群口径';

            let cards = '';
            metricNames.slice(0, 4).forEach(function (n, i) {
                const val = view === 'single' ? t.rows[0][base + i] : pdfScale(t.rows, base + i, rep, i);
                cards += '<div class="pdf-card"><div class="pc-name">' + n + '</div><div class="pc-val">' + val + '</div></div>';
            });

            // 图表：机群 = 各设备取首个数值指标对比；单机 = 近 7 天趋势（示意）
            let chartIdx = -1;
            for (let i = 0; i < metricNames.length; i++) {
                if (!isNaN(pdfNum(t.rows[0][base + i]))) { chartIdx = i; break; }
            }
            let chartHTML = '';
            if (chartIdx >= 0) {
                const ci = base + chartIdx;
                let values = [], labels = [], chartTitle = '';
                if (view === 'fleet') {
                    values = t.rows.map(function (r) { const n = pdfNum(r[ci]); return isNaN(n) ? 0 : n; });
                    labels = t.rows.map(function (r) { return r[idCol]; });
                    chartTitle = '设备对比 · ' + metricNames[chartIdx];
                } else {
                    const bv = pdfNum(t.rows[0][ci]) || 1;
                    labels = ['09-24', '09-25', '09-26', '09-27', '09-28', '09-29', '09-30'];
                    values = labels.map(function (d, i) { return bv * (0.84 + 0.045 * ((i * 3) % 5)); });
                    chartTitle = '近 7 天趋势 · ' + metricNames[chartIdx];
                }
                chartHTML = '<div class="pdf-block-title">' + chartTitle + '</div>' + pdfBarChart(values, labels);
            }

            let pdfTableHTML = '<table class="pdf-table"><thead><tr>';
            t.cols.forEach(function (c) { pdfTableHTML += '<th>' + c + '</th>'; });
            pdfTableHTML += '</tr></thead><tbody>';
            t.rows.forEach(function (row) {
                pdfTableHTML += '<tr>';
                row.forEach(function (cell) { pdfTableHTML += '<td>' + cell + '</td>'; });
                pdfTableHTML += '</tr>';
            });
            pdfTableHTML += '</tbody></table>';

            return '<div class="pdf-stage"><div class="pdf-page">'
                + '<div class="pdf-head">'
                + '<div class="pdf-brand"><span class="pdf-logo">SANY</span>'
                + '<span class="pdf-co">三一智联系统<br>MySANY 设备管理平台</span></div>'
                + '<div class="pdf-title"><h1>' + rep.name + '<span class="pdf-scope">' + scope + '</span></h1>'
                + '<span class="pdf-period">统计周期：' + PERIOD + '</span></div>'
                + '</div>'
                + '<div class="pdf-cards">' + cards + '</div>'
                + chartHTML
                + '<div class="pdf-block-title">数据明细</div>'
                + pdfTableHTML
                + '<div class="pdf-foot"><span>SANY CONFIDENTIAL</span><span>第 1 页</span></div>'
                + '</div></div>';
        }

        function renderPreviewContent() {
            const rep = reports.filter(function (r) { return r.key === previewState.key; })[0];
            if (previewTitle) previewTitle.textContent = rep.name;

            // 数据源未接入的报表：只展示说明
            if (!rep.metrics.length) {

        function pickLangText(v) {
            if (v == null) return '';
            if (typeof v === 'string') return v;
            const order = [currentUiLang(), 'zh-CN'];
            for (let i = 0; i < order.length; i++) {
                const s = v[order[i]];
                if (s && String(s).trim()) return String(s);
            }
            const keys = Object.keys(v);
            for (let j = 0; j < keys.length; j++) {
                const s = v[keys[j]];
                if (s && String(s).trim()) return String(s);
            }
            return '';
        }

                const list = JSON.parse(localStorage.getItem(KEY) || '[]');
                list.unshift({

                    time: time,
                    user: 'Schuck',
                    source: source,
                    reports: reports,
                    note: note,

        // ======== 新手引导 - 红框高亮真实按钮 ========
        (function initOnboarding() {
            if (/[?&]embed=1/.test(location.search)) return;   // 嵌入预览时不弹新手引导
            const steps = [
                {

                    desc: '确定模板后，点击卡片上的<span class="hl">"添加"</span>按钮，选择您所需的报表模板进行设置。',
                    placement: 'below'

                {

                    title: '管理已有报表',
                    desc: '点击顶部<span class="hl">"管理报表"</span>标签页，即可查看、编辑或删除您已添加的所有报表配置。',
                    placement: 'below'
                }
            ];

            let currentIdx = 0;
            let backdropEl, tooltipEl, prevHighlightEl = null;

            function getTarget() {
                const sel = steps[currentIdx].selector;
                const sels = sel.split(',').map(s => s.trim());
                for (const s of sels) {
                    const el = document.querySelector(s);
                    if (el) return el;
                }
                return null;
            }

            function highlightTarget(target) {
                if (!target) return;
                if (prevHighlightEl && prevHighlightEl !== target) {
                    prevHighlightEl.classList.remove('tour-highlight');
                }
                target.classList.add('tour-highlight');
                prevHighlightEl = target;
                target.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            function positionTooltip(target) {
                if (!target || !tooltipEl) return;
                const tr = target.getBoundingClientRect();
                const tpEl = tooltipEl;
                const placement = steps[currentIdx].placement || 'below';
                const gap = 18;

                const tw = tpEl.offsetWidth;
                const th = tpEl.offsetHeight;
                const vw = window.innerWidth;
                const vh = window.innerHeight;

                let left, top;
                let arrowClass = '';

                const tcx = tr.left + tr.width / 2;
                const tcy = tr.top + tr.height / 2;

                if (placement === 'right') {
                    left = tr.right + gap;
                    top = tcy - th / 2;
                    top = Math.max(12, Math.min(top, vh - th - 12));
                    if (left + tw > vw - 12) {
                        left = tr.left - tw - gap;
                        arrowClass = 'left';
                    } else {
                        arrowClass = 'right';
                    }
                } else if (placement === 'left') {
                    left = tr.left - tw - gap;
                    top = tcy - th / 2;
                    top = Math.max(12, Math.min(top, vh - th - 12));
                    if (left < 12) {
                        left = tr.right + gap;
                        arrowClass = 'right';
                    } else {
                        arrowClass = 'left';
                    }
                } else if (placement === 'below') {
                    left = tcx - tw / 2;
                    top = tr.bottom + gap;
                    left = Math.max(12, Math.min(left, vw - tw - 12));
                    if (top + th > vh - 12) {
                        top = tr.top - th - gap;
                        arrowClass = 'above';
                    } else {
                        arrowClass = 'below';
                    }
                } else { // above
                    left = tcx - tw / 2;
                    top = tr.top - th - gap;
                    left = Math.max(12, Math.min(left, vw - tw - 12));
                    if (top < 12) {
                        top = tr.bottom + gap;
                        arrowClass = 'below';
                    } else {
                        arrowClass = 'above';
                    }
                }

                const arrowEl = tpEl.querySelector('.tour-tooltip-arrow');
                if (arrowEl) {
                    arrowEl.style.cssText = '';
                    if (arrowClass === 'right') {
                        arrowEl.style.left = '-7px';
                        arrowEl.style.top = Math.max(14, Math.min(th - 14, tcy - top)) + 'px';
                        arrowEl.style.boxShadow = '-2px 2px 4px rgba(0,0,0,0.06)';
                    } else if (arrowClass === 'left') {
                        arrowEl.style.right = '-7px';
                        arrowEl.style.top = Math.max(14, Math.min(th - 14, tcy - top)) + 'px';
                        arrowEl.style.boxShadow = '2px -2px 4px rgba(0,0,0,0.06)';
                    } else if (arrowClass === 'below') {
                        arrowEl.style.top = '-7px';
                        arrowEl.style.left = Math.max(16, Math.min(tw - 16, tcx - left)) + 'px';
                        arrowEl.style.boxShadow = '-2px -2px 4px rgba(0,0,0,0.06)';
                    } else { // above
                        arrowEl.style.bottom = '-7px';
                        arrowEl.style.left = Math.max(16, Math.min(tw - 16, tcx - left)) + 'px';
                        arrowEl.style.boxShadow = '2px 2px 4px rgba(0,0,0,0.06)';
                    }
                }

                tpEl.className = 'tour-tooltip arrow-' + arrowClass;
                tpEl.style.left = left + 'px';
                tpEl.style.top = top + 'px';
            }

            function render() {
                const s = steps[currentIdx];
                const target = getTarget();

                if (prevHighlightEl) {
                    prevHighlightEl.classList.remove('tour-highlight');
                    prevHighlightEl = null;
                }

                if (target) {
                    highlightTarget(target);
                    setTimeout(() => positionTooltip(target), 300);
                    setTimeout(() => { const t = getTarget(); if (t) positionTooltip(t); }, 900);
                }

                const badgeEl = tooltipEl.querySelector('.tour-step-badge');
                const titleEl = tooltipEl.querySelector('.tour-step-title');
                const descEl = tooltipEl.querySelector('.tour-step-desc');
                const prevBtn = tooltipEl.querySelector('.tour-prev');
                const nextBtn = tooltipEl.querySelector('.tour-next');
                const dots = tooltipEl.querySelectorAll('.tour-dot');

                if (badgeEl) badgeEl.textContent = s.badge;
                if (titleEl) titleEl.textContent = s.title;
                if (descEl) descEl.innerHTML = s.desc;
                if (prevBtn) prevBtn.style.visibility = currentIdx === 0 ? 'hidden' : 'visible';
                if (nextBtn) nextBtn.textContent = currentIdx === steps.length - 1 ? '开始使用' : '下一步';

                dots.forEach((d, i) => d.classList.toggle('active', i === currentIdx));
            }

            function next() {
                if (currentIdx >= steps.length - 1) { close(); return; }
                currentIdx++;
                render();
            }

            function prev() {
                if (currentIdx <= 0) return;
                currentIdx--;
                render();
            }

            function close() {
                if (prevHighlightEl) {
                    prevHighlightEl.classList.remove('tour-highlight');
                    prevHighlightEl = null;
                }
                if (tooltipEl) { tooltipEl.remove(); tooltipEl = null; }
                if (backdropEl) { backdropEl.remove(); backdropEl = null; }
            }

            // ---- 构建 DOM ----
            backdropEl = document.createElement('div');
            backdropEl.className = 'tour-backdrop';
            backdropEl.addEventListener('click', function(e) { e.stopPropagation(); });
            document.body.appendChild(backdropEl);

            tooltipEl = document.createElement('div');
            tooltipEl.className = 'tour-tooltip arrow-below';
            tooltipEl.innerHTML = `
                <div class="tour-tooltip-arrow"></div>
                <div class="tour-step-badge"></div>
                <div class="tour-step-title"></div>
                <div class="tour-step-desc"></div>
                <div class="tour-dots">
                    ${steps.map(() => '<span class="tour-dot"></span>').join('')}
                </div>
                <div class="tour-actions">
                    <button class="tour-skip">跳过指引</button>
                    <div class="tour-nav">
                        <button class="tour-btn tour-prev">上一步</button>
                        <button class="tour-btn primary tour-next">下一步</button>
                    </div>
                </div>
            `;
            document.body.appendChild(tooltipEl);

            tooltipEl.querySelector('.tour-skip').addEventListener('click', close);
            tooltipEl.querySelector('.tour-prev').addEventListener('click', prev);
            tooltipEl.querySelector('.tour-next').addEventListener('click', next);

            function onEsc(e) {
                if (e.key === 'Escape') { close(); document.removeEventListener('keydown', onEsc); }
            }
            document.addEventListener('keydown', onEsc);

            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    const target = getTarget();
                    if (target) positionTooltip(target);
                }, 200);
            });

            setTimeout(() => render(), 100);
        })();
    </script>
            </main>
        </div>
    </div>
</body>
</html>
